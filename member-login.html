
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Member Login | Neuron Blood Foundation</title>

<style>
:root{
    --green:#087653;
    --dark:#064b37;
    --text:#263b32;
    --muted:#78877f;
    --border:#b9cbbf;
    --light:#f2f8f4;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px 15px;
    color:var(--text);
    background:#f1f7f3;
    position:relative;
}

/* BACKGROUND IMAGE */

body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:url("login-bg.jpg");
    background-size:cover;
    background-position:center;
    opacity:.10;
    pointer-events:none;
    z-index:0;
}

/* LOGIN CARD */

.login-card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:430px;
    background:#fff;
    border:1.5px solid #c6d8cc;
    border-radius:13px;
    padding:30px 30px 23px;
    box-shadow:0 8px 25px rgba(20,75,48,.12);
}

/* BRAND */

.brand{
    text-align:center;
    margin-bottom:27px;
}

.brand-logo{
    width:55px;
    height:55px;
    margin:0 auto 10px;
    border-radius:50%;
    background:#e7f4eb;
    color:var(--green);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    font-weight:800;
    border:1px solid #c9e3d1;
}

.brand-name{
    color:var(--green);
    font-size:17px;
    font-weight:800;
    letter-spacing:.3px;
}

.brand-tagline{
    margin-top:6px;
    font-size:11px;
    color:#7c8981;
}

/* HEADING */

.form-heading{
    text-align:center;
    margin-bottom:24px;
}

.small-title{
    color:var(--green);
    font-size:11px;
    font-weight:800;
    letter-spacing:1.3px;
    margin-bottom:7px;
}

.form-heading h1{
    color:var(--dark);
    font-size:25px;
    margin-bottom:8px;
}

.form-heading p{
    color:var(--muted);
    font-size:12px;
    line-height:1.7;
}

/* INPUTS */

.field{
    margin-bottom:17px;
}

.field label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:7px;
    color:#344b3e;
}

.input-wrap{
    position:relative;
}

.field input{
    width:100%;
    height:46px;
    border:1.5px solid var(--border);
    border-radius:7px;
    padding:0 13px;
    outline:none;
    font-size:13px;
    color:var(--text);
    background:#fff;
    transition:.2s;
}

.field input:focus{
    border-color:var(--green);
    box-shadow:0 0 0 2px rgba(8,118,83,.10);
}

.field input::placeholder{
    color:#9ba79f;
}

.password-input{
    padding-right:45px !important;
}

.eye-btn{
    position:absolute;
    right:8px;
    top:50%;
    transform:translateY(-50%);
    width:32px;
    height:32px;
    border:0;
    background:transparent;
    color:#718278;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
}

.eye-btn svg{
    width:20px;
    height:20px;
}

/* FORGOT PASSWORD */

.forgot-row{
    display:flex;
    justify-content:flex-end;
    margin-top:-5px;
    margin-bottom:20px;
}

.forgot-btn{
    border:0;
    background:none;
    color:var(--green);
    font-size:11px;
    font-weight:700;
    cursor:pointer;
}

.forgot-btn:hover{
    text-decoration:underline;
}

/* LOGIN BUTTON */

.login-btn{
    width:100%;
    min-height:46px;
    border:1px solid #056344;
    border-radius:7px;
    background:var(--green);
    color:white;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
    transition:.2s;
}

.login-btn:hover{
    background:var(--dark);
}

.login-btn:disabled{
    opacity:.65;
    cursor:not-allowed;
}

/* LOADING */

.spinner{
    display:inline-block;
    width:14px;
    height:14px;
    border:2px solid rgba(255,255,255,.35);
    border-top-color:white;
    border-radius:50%;
    animation:spin .7s linear infinite;
    vertical-align:middle;
    margin-right:7px;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

/* MESSAGE */

.message{
    display:none;
    margin-top:13px;
    padding:11px;
    border-radius:7px;
    font-size:12px;
    line-height:1.6;
}

.message.error{
    display:block;
    color:#a92b2b;
    background:#fff1f1;
    border:1px solid #e9bebe;
}

.message.success{
    display:block;
    color:#087653;
    background:#edf8f1;
    border:1px solid #b9dfc6;
}

/* APPLY LINK */

.apply-box{
    margin-top:22px;
    padding-top:17px;
    border-top:1px solid #e0e9e3;
    text-align:center;
    font-size:12px;
    color:var(--muted);
}

.apply-link{
    display:inline-block;
    margin-top:7px;
    color:var(--green);
    font-weight:800;
    text-decoration:none;
}

.apply-link:hover{
    text-decoration:underline;
}

/* BACK BUTTON */

.back-btn{
    width:100%;
    height:40px;
    margin-top:13px;
    border:1.5px solid #b9cbbf;
    border-radius:7px;
    background:#fff;
    color:#3c5948;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.back-btn:hover{
    background:#edf6f0;
    border-color:var(--green);
}

.back-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* FOOTER */

.footer{
    margin-top:20px;
    text-align:center;
    font-size:10px;
    line-height:1.8;
    color:#9aa69e;
}

/* MOBILE */

@media(max-width:480px){

    body{
        padding:18px 13px;
    }

    .login-card{
        max-width:380px;
        padding:25px 21px 20px;
    }

    .brand{
        margin-bottom:23px;
    }

    .brand-logo{
        width:49px;
        height:49px;
        font-size:24px;
    }

    .brand-name{
        font-size:15px;
    }

    .form-heading h1{
        font-size:23px;
    }
}

@media(max-width:340px){

    .login-card{
        padding:22px 16px 18px;
    }

}
</style>
</head>

<body>

<main class="login-card">

    <!-- BRAND -->

    <div class="brand">

        <div class="brand-logo">N</div>

        <div class="brand-name">
            NEURON BLOOD FOUNDATION
        </div>

        <p class="brand-tagline">
            With youth; on the path of humanity
        </p>

    </div>


    <!-- HEADING -->

    <div class="form-heading">

        <div class="small-title">MEMBER PORTAL</div>

        <h1>Member Login</h1>

        <p>
            Welcome back!
            <br>
            Login to access your member profile.
        </p>

    </div>


    <!-- LOGIN FORM -->

    <form id="loginForm">

        <div class="field">

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email address"
                autocomplete="username"
                required
            >

        </div>


        <div class="field">

            <label for="password">Password</label>

            <div class="input-wrap">

                <input
                    type="password"
                    id="password"
                    class="password-input"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="eye-btn"
                    id="showPassword"
                    aria-label="Show password"
                    title="Show password"
                >

                    <svg xmlns="http://www.w3.org/2000/svg"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round">

                        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
                        <circle cx="12" cy="12" r="3"/>

                    </svg>

                </button>

            </div>

        </div>


        <div class="forgot-row">

            <button
                type="button"
                class="forgot-btn"
                id="forgotPassword"
            >
                Forgot Password?
            </button>

        </div>


        <button
            type="submit"
            class="login-btn"
            id="loginBtn"
        >
            LOGIN
        </button>


        <div id="message" class="message"></div>

    </form>


    <!-- APPLY -->

    <div class="apply-box">

        Not a member yet?

        <br>

        <a
            href="member-registration.html"
            class="apply-link"
        >
            Apply as Member
        </a>

    </div>


    <!-- BACK -->

    <button
        type="button"
        class="back-btn"
        id="backBtn"
    >
        ← Back
    </button>


    <!-- FOOTER -->

    <div class="footer">

        © Neuron Blood Foundation
        <br>
        With youth; on the path of humanity

    </div>

</main>


<script type="module">

/* FIREBASE IMPORTS */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    setPersistence,
    browserSessionPersistence,
    signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {
    apiKey: "AIzaSyBj65RM91KmaoARYOfSH1hs-6TY5Qo2SzA",
    authDomain: "neuron-blood-foundation.firebaseapp.com",
    projectId: "neuron-blood-foundation",
    storageBucket: "neuron-blood-foundation.firebasestorage.app",
    messagingSenderId: "160902995293",
    appId: "1:160902995293:web:cb9a42dfa4b61d593e5cb4",
    measurementId: "G-90P3HEZLPJ"
};


/* INITIALIZE */

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


/* ELEMENTS */

const form = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const message = document.getElementById("message");
const forgotBtn = document.getElementById("forgotPassword");
const eyeBtn = document.getElementById("showPassword");
const backBtn = document.getElementById("backBtn");


/* MESSAGE */

function showMessage(text,type){

    message.textContent = text;
    message.className = "message " + type;

}

function clearMessage(){

    message.textContent = "";
    message.className = "message";

}


/* FRESH LOGIN PREPARATION */

let freshSessionReady = signOut(auth);

window.addEventListener("pageshow",function(event){

    if(event.persisted){

        freshSessionReady = signOut(auth);
        clearMessage();

    }

});


/* SHOW / HIDE PASSWORD */

const eyeOpen = `
<svg xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 24 24" fill="none"
stroke="currentColor" stroke-width="2"
stroke-linecap="round" stroke-linejoin="round">
<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
<circle cx="12" cy="12" r="3"/>
</svg>`;

const eyeClosed = `
<svg xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 24 24" fill="none"
stroke="currentColor" stroke-width="2"
stroke-linecap="round" stroke-linejoin="round">
<path d="M3 3l18 18"/>
<path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
<path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a15 15 0 0 1-3 3.8"/>
<path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1.2 0 2.3-.3 3.3-.7"/>
</svg>`;

eyeBtn.onclick = function(){

    if(passwordInput.type === "password"){

        passwordInput.type = "text";
        eyeBtn.innerHTML = eyeClosed;
        eyeBtn.setAttribute("aria-label","Hide password");
        eyeBtn.title = "Hide password";

    }else{

        passwordInput.type = "password";
        eyeBtn.innerHTML = eyeOpen;
        eyeBtn.setAttribute("aria-label","Show password");
        eyeBtn.title = "Show password";

    }

};


/* BACK BUTTON */

backBtn.onclick = async function(){

    backBtn.disabled = true;

    try{

        await signOut(auth);

    }catch(error){

        console.error("Sign out error:",error);

    }

    if(window.history.length > 1){

        window.history.back();

    }else{

        window.location.replace("index.html");

    }

};


/* FORGOT PASSWORD */

forgotBtn.onclick = async function(){

    const email = emailInput.value.trim();

    if(!email){

        showMessage(
            "Please enter your registered email address first.",
            "error"
        );

        emailInput.focus();
        return;

    }

    forgotBtn.disabled = true;

    showMessage(
        "Sending password reset email...",
        "success"
    );

    try{

        await sendPasswordResetEmail(auth,email);

        showMessage(
            "If an account exists for this email, a password reset email will be sent. Please check your inbox.",
            "success"
        );

    }
    catch(error){

        console.error("Password reset error:",error);

        showMessage(
            "Unable to send reset email. Please try again.",
            "error"
        );

    }
    finally{

        forgotBtn.disabled = false;

    }

};


/* MEMBER LOGIN */

form.addEventListener("submit",async function(e){

    e.preventDefault();

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if(!email || !password){

        showMessage(
            "Please enter your Email and Password.",
            "error"
        );

        return;

    }

    loginBtn.disabled = true;

    loginBtn.innerHTML =
        '<span class="spinner"></span>VERIFYING ACCOUNT...';

    clearMessage();

    try{

        /* WAIT FOR FRESH SESSION */

        await freshSessionReady;

        /* SESSION-ONLY LOGIN */

        await setPersistence(
            auth,
            browserSessionPersistence
        );


        /* FIREBASE AUTHENTICATION */

        const result = await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        const signedInUser = result.user;


        /* FIND APPROVED MEMBER USING UID */

        const memberQuery = query(
            collection(db,"members"),
            where("uid","==",signedInUser.uid)
        );

        const memberSnapshot = await getDocs(memberQuery);

        let approvedMember = false;

        memberSnapshot.forEach(memberDoc=>{

            const data = memberDoc.data();

            if(data.status === "Approved"){
                approvedMember = true;
            }

        });


        if(approvedMember){

            showMessage(
                "Login successful! Opening your profile...",
                "success"
            );

            window.location.replace("member-profile.html");
            return;

        }


        /* CHECK APPLICATION STATUS */

        const applicationQuery = query(
            collection(db,"memberApplications"),
            where("uid","==",signedInUser.uid)
        );

        const applicationSnapshot = await getDocs(applicationQuery);

        let statusMessage =
            "No approved member profile was found for this account. Please contact the Foundation.";

        applicationSnapshot.forEach(applicationDoc=>{

            const data = applicationDoc.data();

            if(data.status === "Pending"){

                statusMessage =
                    "Your membership application is still pending approval.";

            }
            else if(data.status === "Rejected"){

                statusMessage =
                    "Your membership application was not approved. Please contact the Foundation.";

            }

        });


        await signOut(auth);

        showMessage(statusMessage,"error");

    }
    catch(error){

        console.error("Member Login Error:",error);

        if(auth.currentUser){

            try{
                await signOut(auth);
            }catch(signOutError){
                console.error(signOutError);
            }

        }

        let errorText =
            "Login failed. Please check your email and password.";

        if(error.code === "auth/too-many-requests"){

            errorText =
                "Too many attempts. Please try again later.";

        }

        if(error.code === "auth/network-request-failed"){

            errorText =
                "Network error. Please check your internet connection.";

        }

        showMessage(errorText,"error");

    }
    finally{

        loginBtn.disabled = false;
        loginBtn.textContent = "LOGIN";

    }

});

</script>

</body>
</html>

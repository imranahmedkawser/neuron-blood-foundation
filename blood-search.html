<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Blood Group Donors | Neuron Blood Foundation</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f8f5;
    padding: 20px;
    color: #222;
}

.container {
    max-width: 900px;
    margin: auto;
}

.header {
    background: linear-gradient(135deg, #0b8f4d, #16a34a);
    color: white;
    padding: 28px 15px;
    border-radius: 16px;
    text-align: center;
    margin-bottom: 20px;
}

.header h1 {
    font-size: 26px;
    margin-bottom: 10px;
}

.header p {
    margin-bottom: 15px;
}

.nav-btn {
    display: inline-block;
    background: white;
    color: #0b8f4d;
    text-decoration: none;
    padding: 10px 15px;
    border-radius: 8px;
    font-weight: bold;
    margin: 4px;
}

.group-title {
    text-align: center;
    margin: 20px 0;
    color: #0b8f4d;
}

#statusMessage {
    text-align: center;
    margin: 20px 0;
    color: #555;
}

.donor-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 15px;
}

.donor-card {
    background: white;
    padding: 18px;
    border-radius: 12px;
    border-top: 4px solid #16a34a;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
    overflow-wrap: anywhere;
}

.donor-card h3 {
    margin-bottom: 10px;
}

.blood-badge {
    display: inline-block;
    background: #d90000;
    color: white;
    padding: 6px 12px;
    border-radius: 20px;
    font-weight: bold;
    margin-bottom: 12px;
}

.info {
    margin: 8px 0;
    line-height: 1.5;
}

.actions {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

.actions a {
    flex: 1;
    text-align: center;
    padding: 10px 5px;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
}

.call-btn {
    background: #16a34a;
}

.whatsapp-btn {
    background: #25D366;
}

@media (max-width: 600px) {
    .donor-grid {
        grid-template-columns: 1fr;
    }

    .header h1 {
        font-size: 22px;
    }
}
</style>
</head>

<body>

<div class="container">

    <header class="header">
        <h1>🩸 Neuron Blood Foundation</h1>
        <p>Find approved blood donors</p>

        <a class="nav-btn" href="index.html">
            <i class="fa-solid fa-house"></i> Home
        </a>

        <a class="nav-btn" href="donor-list.html">
            <i class="fa-solid fa-arrow-left"></i> All Donors
        </a>
    </header>

    <h2 class="group-title" id="selectedGroup">
        Loading Blood Group...
    </h2>

    <p id="statusMessage">Loading donors...</p>

    <div id="donorGrid" class="donor-grid"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {
    apiKey: "AIzaSyBj65RM91KmaoARYOfSH1hs-6TY5Qo2SzA",
    authDomain: "neuron-blood-foundation.firebaseapp.com",
    projectId: "neuron-blood-foundation",
    storageBucket: "neuron-blood-foundation.firebasestorage.app",
    messagingSenderId: "160902995293",
    appId: "1:1:160902995293:web:d0e4137de45290873e5cb4",
    measurementId: "G-2NVL55Q5GN"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(window.location.search);
const bloodGroup = params.get("group");

const selectedGroup =
    document.getElementById("selectedGroup");

const statusMessage =
    document.getElementById("statusMessage");

const donorGrid =
    document.getElementById("donorGrid");


const validGroups = [
    "A+", "A-", "B+", "B-",
    "AB+", "AB-", "O+", "O-"
];

if (!validGroups.includes(bloodGroup)) {

    selectedGroup.textContent = "Invalid Blood Group";

    statusMessage.textContent =
        "Please select a blood group from the Home Page.";

} else {

    selectedGroup.textContent =
        "Blood Group: " + bloodGroup + " Donors";

    onSnapshot(
        collection(db, "donors"),

        (snapshot) => {

            donorGrid.innerHTML = "";

            let count = 0;

            snapshot.forEach((documentSnapshot) => {

                const donor = documentSnapshot.data();

                if (donor.status !== "Approved") return;

                if (donor.blood !== bloodGroup) return;

                count++;

                const card = document.createElement("div");
                card.className = "donor-card";

                const name = document.createElement("h3");
                name.textContent = donor.name || "Name not available";
                card.appendChild(name);

                const badge = document.createElement("span");
                badge.className = "blood-badge";
                badge.textContent = donor.blood || "";
                card.appendChild(badge);

                const district = document.createElement("p");
                district.className = "info";
                district.textContent =
                    "📍 District: " + (donor.district || "Not available");
                card.appendChild(district);

                const upazila = document.createElement("p");
                upazila.className = "info";
                upazila.textContent =
                    "📌 Upazila: " + (donor.upazila || "Not available");
                card.appendChild(upazila);

                const actions = document.createElement("div");
                actions.className = "actions";

                const phone = String(donor.phone || "").replace(/\D/g, "");

                if (phone) {

                    const call = document.createElement("a");
                    call.className = "call-btn";
                    call.href = "tel:" + phone;
                    call.textContent = "📞 Call";
                    actions.appendChild(call);

                    const whatsappNumber =
                        phone.startsWith("880")
                            ? phone
                            : phone.startsWith("0")
                                ? "88" + phone
                                : "880" + phone;

                    const whatsapp = document.createElement("a");
                    whatsapp.className = "whatsapp-btn";
                    whatsapp.href =
                        "https://wa.me/" + whatsappNumber;
                    whatsapp.target = "_blank";
                    whatsapp.rel = "noopener noreferrer";
                    whatsapp.textContent = "WhatsApp";
                    actions.appendChild(whatsapp);
                }

                card.appendChild(actions);
                donorGrid.appendChild(card);

            });

            if (count === 0) {

                statusMessage.textContent =
                    "এই Blood Group-এর কোনো অনুমোদিত Donor পাওয়া যায়নি।";

            } else {

                statusMessage.textContent =
                    "মোট " + count + " জন অনুমোদিত Donor পাওয়া গেছে।";

            }

        },

        (error) => {

            console.error("Firebase error:", error);

            statusMessage.textContent =
                "Donor list load করা যায়নি। Firebase connection ও permissions পরীক্ষা করুন.";

        }
    );

}

</script>

</body>
</html>

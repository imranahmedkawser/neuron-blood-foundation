<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Password | Neuron Blood Foundation</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f8f5;
      color: #26352d;
      min-height: 100vh;
    }

    header {
      background: #087443;
      color: white;
      padding: 18px 15px;
      text-align: center;
    }

    header h2 {
      font-size: 23px;
      margin-bottom: 6px;
    }

    header p {
      font-size: 13px;
    }

    .container {
      width: 92%;
      max-width: 430px;
      margin: 35px auto;
    }

    .card {
      background: white;
      padding: 28px 22px;
      border-radius: 15px;
      box-shadow: 0 5px 22px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      font-size: 23px;
      color: #087443;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5dfd8;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #087443;
      box-shadow: 0 0 0 2px rgba(8, 116, 67, 0.1);
    }

    .main-btn {
      width: 100%;
      background: #087443;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .main-btn:hover {
      background: #065c35;
    }

    .main-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .notice {
      display: none;
      padding: 12px;
      border-radius: 7px;
      font-size: 13px;
      margin-bottom: 18px;
      line-height: 1.6;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #555;
      text-decoration: none;
      font-size: 14px;
    }

    footer {
      text-align: center;
      color: #777;
      font-size: 12px;
      padding: 15px;
      line-height: 1.8;
    }

    @media (max-width: 480px) {
      .container {
        margin: 25px auto;
      }

      .card {
        padding: 25px 18px;
      }

      header h2 {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h2>🩸 Neuron Blood Foundation</h2>
    <p>With Youth, On the Path of Humanity</p>
  </header>

  <main class="container">
    <section class="card">

      <h1>Set Password</h1>

      <p class="subtitle">
        পুরোনো Donor-দের জন্য<br>
        আপনার Registration করা মোবাইল নম্বর দিয়ে তথ্য খুঁজুন।
      </p>

      <div class="notice" id="notice" role="status"></div>

      <form id="setPasswordForm">

        <label for="phone">মোবাইল নম্বর</label>
        <input
          type="tel"
          id="phone"
          placeholder="01XXXXXXXXX"
          autocomplete="tel"
          required
        >

        <label for="password">নতুন Password</label>
        <input
          type="password"
          id="password"
          placeholder="কমপক্ষে 6 অক্ষর"
          minlength="6"
          autocomplete="new-password"
          required
        >

        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="আবার Password লিখুন"
          minlength="6"
          autocomplete="new-password"
          required
        >

        <button type="submit" class="main-btn" id="submitBtn">
          Set Password
        </button>

      </form>

      <a href="donor-login.html" class="back">
        ← Donor Login-এ ফিরে যান
      </a>

    </section>
  </main>

  <footer>
    © Neuron Blood Foundation<br>
    মানবতার সেবায়, রক্তদাতার পাশে ❤️
  </footer>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  query,
  where,
  getDocs,
  updateDoc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBj65RM91KmaoARYOfSH1hs-6TY5Qo2SzA",
  authDomain: "neuron-blood-foundation.firebaseapp.com",
  databaseURL: "https://neuron-blood-foundation-default-rtdb.firebaseio.com",
  projectId: "neuron-blood-foundation",
  storageBucket: "neuron-blood-foundation.firebasestorage.app",
  messagingSenderId: "160902995293",
  appId: "1:160902995293:web:d0e4137de45290873e5cb4",
  measurementId: "G-2NVL55Q5GN"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const form = document.getElementById("setPasswordForm");
const notice = document.getElementById("notice");
const button = document.getElementById("submitBtn");

function showNotice(message, success = false) {
  notice.textContent = message;
  notice.style.display = "block";
  notice.style.background = success ? "#e3f4e9" : "#fff3cd";
  notice.style.color = success ? "#087443" : "#795600";
}

form.addEventListener("submit", async function(event) {

  event.preventDefault();

  const phone = document.getElementById("phone").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (!/^01[0-9]{9}$/.test(phone)) {
    showNotice("সঠিক ১১ সংখ্যার মোবাইল নম্বর দিন।");
    return;
  }

  if (password.length < 6) {
    showNotice("Password কমপক্ষে ৬ অক্ষরের হতে হবে।");
    return;
  }

  if (password !== confirmPassword) {
    showNotice("দুটি Password মিলছে না।");
    return;
  }

  button.disabled = true;
  button.textContent = "Processing...";

  let accountCreatedNow = false;

  try {

    // Donor Profile খোঁজা
    const donorsRef = collection(db, "donors");

    const donorQuery = query(
      donorsRef,
      where("phone", "==", phone)
    );

    const snapshot = await getDocs(donorQuery);

    if (snapshot.empty) {
      showNotice("এই মোবাইল নম্বরে কোনো Donor তথ্য পাওয়া যায়নি।");
      return;
    }

    const approvedDonor = snapshot.docs.find(doc => {
      const data = doc.data();
      return String(data.status || "").toLowerCase() === "approved";
    });

    if (!approvedDonor) {
      showNotice("আপনার Donor Registration এখনো Approved হয়নি।");
      return;
    }

    const donorData = approvedDonor.data();

    // Mobile Number থেকে Firebase Email
    const loginEmail = phone + "@donor.neuronfoundation.com";

    let userCredential;

    try {

      // নতুন Authentication Account তৈরি
      userCredential = await createUserWithEmailAndPassword(
        auth,
        loginEmail,
        password
      );

      accountCreatedNow = true;

    } catch (error) {

      // আগে থেকেই Account থাকলে একই Account-এ Login চেষ্টা
      if (error.code === "auth/email-already-in-use") {

        try {
          userCredential = await signInWithEmailAndPassword(
            auth,
            loginEmail,
            password
          );

        } catch (loginError) {

          if (
            loginError.code === "auth/wrong-password" ||
            loginError.code === "auth/invalid-credential"
          ) {
            showNotice(
              "এই Donor-এর Authentication Account আগে থেকেই আছে। আগের Password ব্যবহার করুন।"
            );
            return;
          }

          throw loginError;
        }

      } else {
        throw error;
      }
    }

    const user = userCredential.user;

    // আগে অন্য UID যুক্ত থাকলে সেটি পরিবর্তন করবে না
    const existingUid = String(donorData.uid || "").trim();

    if (existingUid && existingUid !== user.uid) {

      await signOut(auth);

      showNotice(
        "এই Donor Profile অন্য Authentication Account-এর সঙ্গে যুক্ত। Admin-এর সাহায্য নিন।"
      );

      return;
    }

    // Authentication UID Firestore-এ Save
    try {

      await updateDoc(approvedDonor.ref, {
        uid: user.uid,
        authEmail: loginEmail,
        passwordSetAt: serverTimestamp()
      });

    } catch (firestoreError) {

      await signOut(auth);

      console.error("UID save error:", firestoreError);

      if (accountCreatedNow) {
        showNotice(
          "Authentication Account তৈরি হয়েছে, কিন্তু Donor Profile-এর সঙ্গে UID যুক্ত করা যায়নি।Admin-এর সাহায্য নিন।"
        );
      } else {
        showNotice(
          "Account পাওয়া গেছে, কিন্তু Donor Profile-এর সঙ্গে UID যুক্ত করা যায়নি। Admin-এর সাহায্য নিন।"
        );
      }

      return;
    }

    await signOut(auth);

    showNotice(
      "Password সফলভাবে সেট হয়েছে!✅ এখন Donor Login করুন।",
      true
    );

    form.reset();

  } catch (error) {

    console.error("Set Password Error:", error);

    if (error.code === "auth/weak-password") {
      showNotice("Password আরও শক্তিশালী করুন।");
    } else if (error.code === "auth/too-many-requests") {
      showNotice("অনেকবার চেষ্টা হয়েছে। কিছুক্ষণ পর আবার চেষ্টা করুন।");
    } else if (error.code === "permission-denied") {
      showNotice("Firestore Permission সমস্যা হয়েছে।");
    } else {
      showNotice("সমস্যা হয়েছে: " + (error.message || error.code || "Unknown Error"));
    }

  } finally {

    button.disabled = false;
    button.textContent = "Set Password";

  }

});

</script>


</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neuron Blood Foundation - Admin Panel</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
}

.admin-wrapper{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.admin-card{
    width:100%;
    max-width:900px;
    background:#fff;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,.1);
}

.admin-card h2{
    text-align:center;
    color:#d90000;
    margin-bottom:20px;
}

.admin-card input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:6px;
    margin-bottom:12px;
}

.btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:6px;
    background:#d90000;
    color:white;
    cursor:pointer;
}

.btn:hover{
    background:#b50000;
}
    .active-btn{
    background:#28a745 !important;
}

.error{
    color:red;
    margin-top:10px;
    text-align:center;
}

#adminPanel{
    display:none;
    margin-top:20px;
}

#pendingList{
    width:100%;
}

.pending-card{
    border:1px solid #ddd;
    border-radius:8px;
    padding:15px;
    margin-bottom:12px;
    background:#fff;
}

.pending-card h3{
    color:#d90000;
    margin-bottom:8px;
}

.pending-card p{
    margin:4px 0;
}

.action-buttons{
    display:flex;
    gap:10px;
    margin-top:10px;
}

.details-btn{
    flex:1;
    background:#2563eb;
    color:white;
    border:none;
    padding:10px;
    border-radius:6px;
    cursor:pointer;
}
    
.approve-btn{
    flex:1;
    background:green;
    color:white;
    border:none;
    padding:10px;
    border-radius:6px;
    cursor:pointer;
}

.decline-btn{
    flex:1;
    background:#d90000;
    color:white;
    border:none;
    padding:10px;
    border-radius:6px;
    cursor:pointer;
}

.no-data{
    text-align:center;
    font-weight:bold;
    padding:20px;
}

@media(max-width:768px){

    .admin-card{
        max-width:100%;
    }

    .action-buttons{
        flex-direction:column;
    }

}

    .dashboard-box{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-bottom:20px;
}

@media(max-width:768px){

    .dashboard-box{
        grid-template-columns:1fr;
    }

}

    
/* PROFESSIONAL MEMBER DETAILS SHEET */

.details-overlay{
    position:fixed;
    inset:0;
    background:rgba(15,30,25,.58);

.details-panel{

.details-header{

.details-header h2{

.details-header button{

    border:0;

.details-content{
    padding:24px;

    background:#f7f9f8;

.sheet-brand{

.sheet-brand h3{

.sheet-brand p{

.sheet-title{

    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin:18px 0;
}

.sheet-title h3{
    color:#24352d;

}

.sheet-status{
    background:#fff4d6;

    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.applicant-summary{
    display:flex;
    align-items:center;
    gap:16px;
    padding:16px;
    background:#edf6f1;
    border-left:4px solid #087653;
    margin-bottom:22px;
}

.applicant-avatar{
    width:58px;
    height:58px;
    flex-shrink:0;
    border-radius:50%;
    background:#087653;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:25px;
    font-weight:bold;
}

.applicant-summary h3{
    color:#183d2e;
    font-size:17px;
    margin-bottom:5px;
}

.applicant-summary p{
    color:#53665c;
    font-size:13px;
    margin-top:3px;
}

.info-section{
    margin-bottom:22px;
    background:white;
    border:1px solid #e1e9e4;
}

.info-section-title{
    background:#edf4f0;

    padding:12px 15px;

.info-row{
    display:grid;
    grid-template-columns:34% 66%;
    border-bottom:1px solid #edf0ee;
}

.info-row:last-child{

}

.info-label,
.info-value{

.info-label{

.info-value{

.details-actions{

.details-actions button{

}

.details-actions button:nth-child(1){

}

.details-actions button:nth-child(2){

}

.details-actions button:nth-child(3){

@media(max-width:600px){

    .details-overlay{
        padding:10px;
    }

<script type="module">

import {
initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
onSnapshot,
updateDoc,
deleteDoc,
doc,
setDoc,
getDoc,
runTransaction,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {
    apiKey: "AIzaSyBj65RM91KmaoARYOfSH1hs-6TY5Qo2SzA",
    authDomain: "neuron-blood-foundation.firebaseapp.com",
    projectId: "neuron-blood-foundation",
    storageBucket: "neuron-blood-foundation.firebasestorage.app",
    messagingSenderId: "160902995293",
    appId: "1:160902995293:web:cb9a42dfa4b61d593e5cb4",
    measurementId: "G-90P3HEZLPJ"
};


/* INITIALIZE FIREBASE */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* ADMIN LOGIN */

window.adminLogin =
async function(){

const email =
document.getElementById("adminEmail").value.trim();

const password =
document.getElementById("adminPassword").value;

const message =
document.getElementById("adminMessage");


if(!email || !password){

message.innerHTML =
"<div class='error'>Enter Email and Password!</div>";

return;

}


try{

await signInWithEmailAndPassword(
auth,
email,
password
);

message.innerHTML="";

    document.getElementById("loginBox")
.style.display="none";

    document.getElementById("adminPanel")
.style.display="block";

}
catch(error){

message.innerHTML =
"<div class='error'>Invalid Email or Password!</div>";

}

};


/* LOAD PENDING MEMBERS */

function loadPending(){

    const list = document.getElementById("pendingList");

    list.innerHTML = "Loading...";

    onSnapshot(
        collection(db, "memberApplications"),

        snapshot => {

            list.innerHTML = "";

            let found = false;
            let count = 0;

            snapshot.forEach(item => {

                const data = item.data();

                if(data.status === "Pending"){

                    found = true;
                    count++;

                    const div = document.createElement("div");

                    div.className = "pending-card";

                    div.innerHTML = `

                        <h3>
                            ${data.nameEnglish || data.nameBangla || "Name Not Given"}
                        </h3>

                        <p>
                            <b>Phone:</b>
                            ${data.mobile || data.mobileNumber || ""}
                        </p>

                        <p>
                            <b>Email:</b>
                            ${data.email || ""}
                        </p>

                        <p>
                            <b>Role:</b>
                            ${Array.isArray(data.memberTypes)
                                ? data.memberTypes.join(", ")
                                : data.interestedRole || data.memberTypes || ""}
                        </p>

                        <p><b>Status:</b> Pending</p>

                        <div class="action-buttons">

                            <button
                                class="details-btn"
                                onclick="showMemberDetails('${item.id}')">
                                View Details
                            </button>

                            <button
                                class="approve-btn"
                                onclick="approveMember('${item.id}')">
                                Approve
                            </button>

                            <button
                                class="decline-btn"
                                onclick="deleteMember('${item.id}')">
                                Decline
                            </button>

                        </div>
                    `;

                    list.appendChild(div);

                }

            });

            document.getElementById("memberCount").textContent = count;

            if(!found){

                list.innerHTML =
                    "<div class='no-data'>No Pending Members</div>";

            }

        },

        error => {

            console.error(error);

            list.innerHTML =
                "<div class='no-data'>Unable to load Member Requests</div>";

        }
    );

}

    

window.showMemberDetails = async function(id){

    const view = document.getElementById("memberDetailsView");
    const content = document.getElementById("memberDetailsContent");

    view.style.display = "flex";
    content.textContent = "Loading member details...";

    try{

        const applicationRef = doc(db, "memberApplications", id);
        const applicationSnap = await getDoc(applicationRef);

        if(!applicationSnap.exists()){
            content.textContent = "Application not found!";
            return;
        }

        const data = applicationSnap.data();

        // Safe value formatting
        function showValue(value){

            if(value === null || value === undefined || value === ""){
                return "Not provided";
            }

            if(Array.isArray(value)){
                return value.length ? value.join(", ") : "Not provided";
            }

            if(value && typeof value.toDate === "function"){
                return value.toDate().toLocaleDateString("en-GB");
            }

            if(value instanceof Date){
                return value.toLocaleDateString("en-GB");
            }

            if(typeof value === "object"){
                return JSON.stringify(value);
            }

            return String(value);
        }

        // Create one information row
        function infoRow(label, value){

            if(
                value === null ||
                value === undefined ||
                value === ""
            ){
                return "";
            }

            return `
                <div class="info-row">
                    <div class="info-label">${label}</div>
                    <div class="info-value">${showValue(value)}</div>
                </div>
            `;
        }

        // Create information section
        function infoSection(number, title, rows){

            return `
                <section class="info-section">

                    <div class="info-section-title">
                        ${number} &nbsp; ${title}
                    </div>

                    ${rows}

                </section>
            `;
        }

        const applicantName =
            data.nameEnglish ||
            data.nameBangla ||
            "Name Not Given";

        const firstLetter = applicantName.charAt(0).toUpperCase();

        const presentAddress = [
            data.presentVillage,
            data.presentUpazila,
            data.presentDistrict,
            data.presentDivision,
            data.presentFullAddress
        ].filter(Boolean).join(", ");

        const permanentAddress = [
            data.permanentVillage,
            data.permanentUpazila,
            data.permanentDistrict,
            data.permanentDivision,
            data.permanentFullAddress
        ].filter(Boolean).join(", ");

        // 01 Personal Information
        const personalRows =
            infoRow("Name (Bangla)", data.nameBangla) +
            infoRow("Name (English)", data.nameEnglish) +
            infoRow("Father's Name", data.fatherName) +
            infoRow("Mother's Name", data.motherName) +
            infoRow("Date of Birth", data.dob) +
            infoRow("Gender", data.gender) +
            infoRow("Blood Group", data.bloodGroup) +
            infoRow("NID Number", data.nid);

        // 02 Contact Information
        const contactRows =
            infoRow("Mobile Number", data.mobile) +
            infoRow("WhatsApp Number", data.whatsapp) +
            infoRow("Email Address", data.email) +
            infoRow("Facebook Profile", data.facebook);

        // 03 Address Information
        const addressRows =
            infoRow("Present Address", presentAddress) +
            infoRow("Permanent Address", permanentAddress);

        // 04 Other Information
        const otherRows =
            infoRow("Occupation", data.occupation) +
            infoRow("Education", data.education) +
            infoRow("Academic Session", data.session) +
            infoRow("Institution", data.institution) +
            infoRow("Donated Blood Before", data.donatedBefore) +
            infoRow("Last Donation Date", data.lastDonation) +
            infoRow("Physical Issues", data.physicalIssues);

        // 05 Membership Information
        const membershipRows =
            infoRow("Membership Types", data.memberTypes) +
            infoRow("Reason for Joining", data.joinReason) +
            infoRow("Account Email", data.accountEmail) +
            infoRow("Account Phone", data.accountPhone);

        content.innerHTML = `

            <div class="sheet-brand">

                <h3>NEURON BLOOD FOUNDATION</h3>

                <p>With youth; on the path of humanity</p>

            </div>

            <div class="sheet-title">

                <h3>Member Application</h3>

                <span class="sheet-status">
                    ${showValue(data.status)}
                </span>

            </div>

            <div class="applicant-summary">

                <div class="applicant-avatar">
                    ${firstLetter}
                </div>

                <div>

                    <h3>${showValue(applicantName)}</h3>

                    <p>
                        Blood Group:
                        <strong>${showValue(data.bloodGroup)}</strong>
                    </p>

                    <p>
                        Application ID:
                        ${id}
                    </p>

                </div>

            </div>

            ${infoSection("01", "Personal Information", personalRows)}

            ${infoSection("02", "Contact Information", contactRows)}

            ${infoSection("03", "Address Information", addressRows)}

            ${infoSection("04", "Other Information", otherRows)}

            ${infoSection("05", "Membership Information", membershipRows)}

        `;

        document.getElementById("detailsApproveBtn").onclick = function(){

            closeMemberDetails();
            approveMember(id);

        };

        document.getElementById("detailsRejectBtn").onclick = function(){

            closeMemberDetails();
            deleteMember(id);

        };

    }
    catch(error){

        console.error(error);

        content.textContent = "Unable to load application details.";

    }

};

    
window.closeMemberDetails = function(){
    document.getElementById("memberDetailsView").style.display = "none";
};


    /* SHOW MEMBERS */

    document.querySelector("#donorBtn")

    document.querySelector("#emergencyBtn")

document.querySelector("#memberBtn")

                    div.innerHTML=`

                    <h3>${data.name || ""}</h3>

                    <p>
                    <b>Phone:</b>
                    ${data.phone || ""}
                    </p>

                    <p>
                    <b>Blood Group:</b>

                    <b>District:</b>

                    <div class="action-buttons">

                    <button
                    class="approve-btn"

                    <button

                    list.appendChild(div);

            if(!found){

    collection(db,"donors"),

        snapshot.forEach(item=>{

onSnapshot(

/* APPROVE DONOR */

window.approveDonor =
async function(id){

    try{

        await updateDoc(
            doc(db,"donors",id),
            {
                status:"Approved"
            }
        );

        alert("Donor Approved");

    }

/* DELETE DONOR */

window.deleteDonor =
async function(id){

    if(!confirm("Delete this donor?")){

        return;

    }

    try{

        await deleteDoc(
            doc(db,"donors",id)
        );

        alert("Donor Deleted");

    }
    catch(error){

        alert("Error deleting donor");

    }

};

    

/* APPROVE MEMBER + GENERATE UNIQUE MEMBER ID */

window.approveMember = async function(id){

    if(!confirm("Approve this member application?")){
        return;
    }

    try{

        const applicationRef = doc(db, "memberApplications", id);
        const memberRef = doc(db, "members", id);
        const counterRef = doc(db, "settings", "memberIdCounters");

        await runTransaction(db, async (transaction) => {

            // Read application and yearly counter
            const applicationSnap = await transaction.get(applicationRef);
            const counterSnap = await transaction.get(counterRef);

            if(!applicationSnap.exists()){
                throw new Error("Application not found!");
            }

            if(applicationSnap.data().status !== "Pending"){
                throw new Error("This application is no longer pending.");
            }

            // Approval year in Bangladesh
            const year = Number(
                new Intl.DateTimeFormat("en-US", {
                    timeZone: "Asia/Dhaka",
                    year: "numeric"
                }).format(new Date())
            );

            const counterField = "y" + year;

            const previousNumber = counterSnap.exists()
                ? Number(counterSnap.data()[counterField] || 0)
                : 0;

            const nextNumber = previousNumber + 1;

            if(nextNumber > 9999){
                throw new Error("Yearly Member ID limit reached!");
            }

            // Example: 260001, 260002...
            const memberID =
                String(year).slice(-2) +
                String(nextNumber).padStart(4, "0");

            const memberData = applicationSnap.data();

            // Save approved member
            transaction.set(memberRef, {
                ...memberData,
                memberID: memberID,
                status: "Approved",
                approvedAt: serverTimestamp()
            });

            // Update yearly counter
            transaction.set(counterRef, {
                [counterField]: nextNumber
            }, { merge: true });

            // Remove pending application
            transaction.delete(applicationRef);

        });

        alert("Member Approved Successfully!");

    }
    catch(error){

        console.error(error);

        alert("Error approving member: " + error.message);

    }

};

    
/* DECLINE MEMBER */

window.deleteMember = async function(id){

    if(!confirm("Are you sure you want to reject this application?")){
        return;
    }

    try{

        await deleteDoc(
            doc(db, "memberApplications", id)
        );

        alert("Member Application Rejected!");

    }
    catch(error){

        console.error(error);

        alert("Error rejecting application: " + error.message);

    }

};

window.showEmergencies = function(){

    document.querySelector("#emergencyBtn")
    .classList.add("active-btn");

    document.querySelector("#memberBtn")
    .classList.remove("active-btn");

    document.querySelector("#donorBtn")
    .classList.remove("active-btn");

    const list =
    document.getElementById("pendingList");

    list.innerHTML = "Loading Emergency Requests...";


    onSnapshot(
        collection(db, "emergencyRequests"),

        snapshot => {

            list.innerHTML = "";

            let found = false;
            let count = 0;


            snapshot.forEach(item => {

    const data = item.data();

    if(
        data.status === "Closed" ||
        data.status === "Completed"
    ){
        return;
    }

    count++;
    found = true;

                const div =
                document.createElement("div");

                div.className = "pending-card";


                div.innerHTML = `

                    <h3>
                        🩸 ${data.bloodGroup || "Blood Group Not Given"}
                    </h3>

                    <p>
                        <b>Patient Problem:</b>
                        ${data.patientProblem || "Not given"}
                    </p>

                    <p>
                        <b>Blood Quantity:</b>
                        ${data.bloodQuantity || ""}
                    </p>

                    <p>
                        <b>Required Date:</b>
                        ${data.requiredDate || ""}
                    </p>

                    <p>
                        <b>Required Time:</b>
                        ${data.requiredTime || ""}
                    </p>

                    <p>
                        <b>District:</b>
                        ${data.district || ""}
                    </p>

                    <p>
                        <b>Upazila:</b>
                        ${data.upazila || ""}
                    </p>

                    <p>
                        <b>Hospital:</b>
                        ${data.hospital || ""}
                    </p>

                    <p>
                        <b>Contact:</b>
                        ${data.contactNumber || ""}
                    </p>

                    <p>
                        <b>Reference:</b>
                        ${data.referenceName || ""}
                    </p>

                    <p>
                        <b>Reference Number:</b>
                        ${data.referenceNumber || ""}
                    </p>

                    <p>
                        <b>Additional Note:</b>
                        ${data.additionalNote || "No additional note"}
                    </p>

                    <p>
                        <b>Status:</b>
                        ${data.status || "Pending"}
                    </p>

                    <div class="action-buttons">

                        <button
                        class="approve-btn"
                        onclick="approveEmergency('${item.id}')">

                        Approve

                        </button>

                        <button
                        class="decline-btn"
                        onclick="closeEmergency('${item.id}')">

                        Close

                        </button>

                    </div>

                `;


                list.appendChild(div);

            });


            document.getElementById("emergencyCount")
            .textContent = count;


            if(!found){

                list.innerHTML =
                "<div class='no-data'>No Emergency Requests</div>";

            }

        },

        error => {

            console.error(error);

            list.innerHTML =
            "<div class='no-data'>Unable to load Emergency Requests</div>";

        }

    );

};

/* APPROVE EMERGENCY */

window.approveEmergency =
async function(id){

    try{

        await updateDoc(
            doc(db,"emergencyRequests",id),
            {
                status:"Approved"
            }
        );

        alert("🚨 Emergency Request Approved");

    }
    catch(error){

        console.error(error);

        alert("❌ Error approving emergency request");

    }

};


/* CLOSE EMERGENCY */

window.closeEmergency =
async function(id){

    if(!confirm("Close this emergency request?")){

        return;

    }

    try{

        await updateDoc(
            doc(db,"emergencyRequests",id),
            {
                status:"Closed"
            }
        );

        alert("✅ Emergency Request Closed");

    }
    catch(error){

        console.error(error);

        alert("❌ Error closing emergency request");

    }

};

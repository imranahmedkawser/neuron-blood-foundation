<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Approved Donor List</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f8f5;
padding:20px;
}

.container{
max-width:1400px;
margin:auto;
}

.header{
background:linear-gradient(135deg,#0b8f4d,#16a34a);
color:white;
padding:35px 20px;
border-radius:20px;
text-align:center;
margin-bottom:20px;
box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.header h1{
font-size:32px;
margin-bottom:10px;
}

.filter-box{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,.08);
margin-bottom:20px;
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.filter-box input,
.filter-box select{
padding:12px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
}

.stats-box{
margin-bottom:20px;
}

.stat-card{
background:white;
padding:20px;
border-radius:15px;
text-align:center;
box-shadow:0 0 15px rgba(0,0,0,.08);
}

.stat-card h3{
font-size:30px;
color:#16a34a;
margin-bottom:5px;
}

.donor-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
}

.donor-card{
background:white;
border-radius:18px;
padding:20px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
border-top:5px solid #16a34a;
}

.avatar{
width:90px;
height:90px;
border-radius:50%;
margin:auto;
display:flex;
align-items:center;
justify-content:center;
font-size:40px;
background:#f1f1f1;
margin-bottom:15px;
}

.name{
font-size:22px;
font-weight:bold;
text-align:center;
margin-bottom:8px;
}

.blood{
display:inline-block;
background:#d90000;
color:white;
padding:6px 12px;
border-radius:20px;
font-weight:bold;
}

.status{
font-weight:bold;
margin-top:10px;
}

.available{
color:green;
}

.unavailable{
color:red;
}

.action-buttons{
display:flex;
gap:10px;
margin-top:15px;
}

.action-buttons button{
flex:1;
border:none;
padding:12px;
border-radius:10px;
cursor:pointer;
color:white;
font-weight:bold;
}

.call-btn{
background:#16a34a;
}

.whatsapp-btn{
background:#25D366;
}

.details-btn{
background:#d90000;
}

@media(max-width:768px){

.filter-box{
grid-template-columns:1fr;
}

.donor-grid{
grid-template-columns:1fr;
}

.header h1{
font-size:24px;
}

}

</style>

</head>

<body>

<div class="container">

    <!-- Header -->
    <div class="header">

        <h1>🩸 Approved Blood Donors</h1>

        <p>
            Find verified blood donors quickly
        </p>

    </div>

    <!-- Search & Filter -->
    <div class="filter-box">

        <input
        type="text"
        id="searchInput"
        placeholder="🔍 Search donor">

        <select id="bloodFilter">
            <option value="">All Blood Groups</option>
        </select>

        <select id="divisionFilter">
            <option value="">All Divisions</option>
        </select>

        <select id="districtFilter">
            <option value="">All Districts</option>
        </select>

        <select id="upazilaFilter">
            <option value="">All Upazilas</option>
        </select>

    </div>

    <!-- Statistics -->
    <div class="stats-box">

        <div class="stat-card">

            <h3 id="totalDonors">0</h3>

            <p>Total Approved Donors</p>

        </div>

    </div>

    <!-- Donor Cards -->
    <div id="donorGrid" class="donor-grid">

        Loading Donors...

    </div>

</div>


<script type="module">

// Firebase code এখানে বসবে

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Emergency Blood Requests - Neuron Blood Foundation</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f7faf8;
    color:#222;
}


/* NAVBAR */

.navbar{
    background:#006b3c;
    padding:15px 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    color:white;
    font-size:22px;
    font-weight:700;
}

.nav-links{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.nav-links a{
    color:white;
    text-decoration:none;
    padding:9px 14px;
    border-radius:6px;
    font-weight:600;
}

.nav-links a:hover,
.nav-links .active{
    background:#ffffff;
    color:#006b3c;
}


/* PAGE HEADER */

.page-header{
    text-align:center;
    padding:40px 20px 25px;
}

.page-header h1{
    color:#006b3c;
    font-size:32px;
    margin-bottom:8px;
}

.page-header p{
    color:#666;
    font-size:16px;
}


/* REQUEST BUTTON */

.request-box{
    text-align:center;
    margin-bottom:30px;
}

.request-btn{
    display:inline-block;
    background:#d90429;
    color:white;
    padding:12px 22px;
    border-radius:8px;
    text-decoration:none;
    font-weight:700;
}

.request-btn:hover{
    background:#b80322;
}


/* REQUEST LIST */

.requests-container{
    width:90%;
    max-width:1100px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
    padding-bottom:50px;
}


/* CARD */

.request-card{
    background:white;
    border:1px solid #e2e8e5;
    border-left:5px solid #d90429;
    border-radius:10px;
    padding:20px;
    box-shadow:0 3px 10px rgba(0,0,0,.06);
}

.request-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.blood-group{
    background:#d90429;
    color:white;
    padding:7px 12px;
    border-radius:6px;
    font-size:20px;
    font-weight:700;
}

.status{
    background:#dcfce7;
    color:#15803d;
    padding:5px 10px;
    border-radius:20px;
    font-size:13px;
    font-weight:700;
}

.request-card h3{
    color:#006b3c;
    margin-bottom:12px;
}

.info{
    margin:7px 0;
    color:#444;
    font-size:14px;
}

.info i{
    width:20px;
    color:#006b3c;
}

.note{
    background:#f8fafc;
    padding:10px;
    margin-top:12px;
    border-radius:7px;
    font-size:14px;
}

.loading,
.no-data{
    grid-column:1/-1;
    text-align:center;
    padding:40px;
    color:#666;
}


/* FOOTER */

footer{
    background:#006b3c;
    color:white;
    text-align:center;
    padding:25px 15px;
}

footer h3{
    margin-bottom:5px;
}

footer p{
    font-size:14px;
    opacity:.9;
}


/* MOBILE */

@media(max-width:768px){

    .navbar{
        flex-direction:column;
        text-align:center;
    }

    .nav-links{
        justify-content:center;
    }

    .nav-links a{
        font-size:13px;
        padding:8px 10px;
    }

    .page-header h1{
        font-size:26px;
    }

}

</style>

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">
        🩸 Neuron Blood Foundation
    </div>

    <div class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="donor-list.html">
            Donor List
        </a>

        <a href="emergency.html" class="active">
            Emergency
        </a>

    </div>

</nav>


<!-- HEADER -->

<section class="page-header">

    <h1>
        Emergency Blood Requests
    </h1>

    <p>
        Find active blood requests and help save a life.
    </p>

</section>


<!-- REQUEST BUTTON -->

<div class="request-box">

    <a href="donor-list.html" class="request-btn">
        <i class="fa-solid fa-plus"></i>
        Post an Emergency Blood Request
    </a>

</div>


<!-- REQUESTS -->

<div id="requestList" class="requests-container">

    <div class="loading">
        Loading emergency requests...
    </div>

</div>


<!-- FOOTER -->

<footer>

    <h3>Neuron Blood Foundation</h3>

    <p>
        With youth; on the path of humanity
    </p>

</footer>


<!-- FIREBASE -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyBj65RM91KmaoARYOfSH1hs-6TY5Qo2SzA",

    authDomain: "neuron-blood-foundation.firebaseapp.com",

    projectId: "neuron-blood-foundation",

    storageBucket: "neuron-blood-foundation.firebasestorage.app",

    messagingSenderId: "160902995293",

    appId: "1:160902995293:web:cb9a42dfa4b61d593e5cb4",

    measurementId: "G-90P3HEZLPJ"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


const requestList =
document.getElementById("requestList");


onSnapshot(

    collection(db, "emergencyRequests"),

    snapshot => {

        requestList.innerHTML = "";

        let found = false;


        snapshot.forEach(item => {

            const data = item.data();


            // শুধু Approved request দেখাবে

            if(data.status !== "Approved"){
                return;
            }


            found = true;


            const card =
            document.createElement("div");

            card.className =
            "request-card";


            card.innerHTML = `

                <div class="request-top">

                    <span class="blood-group">
                        ${data.bloodGroup || "N/A"}
                    </span>

                    <span class="status">
                        Approved
                    </span>

                </div>


                <h3>
                    🏥 ${data.hospital || "Hospital not given"}
                </h3>


                <div class="info">
                    <i class="fa-solid fa-droplet"></i>
                    <b>Blood Quantity:</b>
                    ${data.bloodQuantity || "Not given"}
                </div>


                <div class="info">
                    <i class="fa-solid fa-calendar"></i>
                    <b>Required Date:</b>
                    ${data.requiredDate || "Not given"}
                </div>


                <div class="info">
                    <i class="fa-solid fa-clock"></i>
                    <b>Required Time:</b>
                    ${data.requiredTime || "Not given"}
                </div>


                <div class="info">
                    <i class="fa-solid fa-location-dot"></i>
                    <b>Location:</b>
                    ${data.district || ""}
                    ${data.upazila ? ", " + data.upazila : ""}
                </div>


                <div class="info">
                    <i class="fa-solid fa-phone"></i>
                    <b>Contact:</b>
                    ${data.contactNumber || "Not given"}
                </div>


                <div class="info">
                    <i class="fa-solid fa-user"></i>
                    <b>Reference:</b>
                    ${data.referenceName || "Not given"}
                </div>


                <div class="info">
                    <i class="fa-solid fa-phone"></i>
                    <b>Reference Number:</b>
                    ${data.referenceNumber || "Not given"}
                </div>


                <div class="info">
                    <i class="fa-solid fa-notes-medical"></i>
                    <b>Patient Problem:</b>
                    ${data.patientProblem || "Not given"}
                </div>


                <div class="note">

                    <b>Additional Note:</b><br>

                    ${data.additionalNote || "No additional note"}

                </div>

            `;


            requestList.appendChild(card);

        });


        if(!found){

            requestList.innerHTML = `

                <div class="no-data">

                    <h3>
                        No Active Emergency Requests
                    </h3>

                    <p>
                        There are currently no approved blood requests.
                    </p>

                </div>

            `;

        }

    },


    error => {

        console.error(error);

        requestList.innerHTML = `

            <div class="no-data">

                Unable to load emergency requests.

            </div>

        `;

    }

);

</script>


</body>

</html>

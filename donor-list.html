.header{

.filter-box{

}

.stats-box{

}

.stat-card{
background:white;
padding:20px;
border-radius:15px;
text-align:center;
box-shadow:0 0 15px rgba(0,0,0,.08);
}

.stat-card h3{
font-size:30px;
color:#16a34a;
margin-bottom:5px;
}

.donor-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
}

.donor-card{
background:white;
border-radius:12px;
padding:12px;
box-shadow:0 3px 10px rgba(0,0,0,.08);

.avatar{
width:60px;
height:60px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;

background:#f1f1f1;

.name{

font-weight:bold;
text-align:center;
margin-bottom:8px;

.top-info{

align-items:center;
gap:12px;
margin-bottom:10px;
}
    
.blood{

background:#d90000;
color:white;
padding:6px 12px;
border-radius:20px;
font-weight:bold;
}

.status{
font-weight:bold;
margin-top:10px;
}

.available{
color:green;
}

.unavailable{
color:red;
}

.action-buttons{
display:flex;
gap:10px;
margin-top:15px;
}

.action-buttons button{
flex:1;
border:none;
padding:12px;
border-radius:10px;
cursor:pointer;
color:white;
font-weight:bold;
}

.call-btn{
background:#16a34a;
}

.whatsapp-btn{
background:#25D366;
}

.details-btn{
background:#2563eb;
}

.donor-grid{

.header h1{

    #emergencyBtn{
position:fixed;
bottom:20px;
right:20px;
background:linear-gradient(135deg,#0b8f4d,#16a34a);

border:none;
padding:15px 20px;
border-radius:50px;

font-weight:bold;

z-index:999;
box-shadow:0 8px 25px

@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.05);
}

100%{
transform:scale(1);

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
onSnapshot,
addDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyBj65RM91KmaoARYOfSH1hs-6TY5Qo2SzA",
authDomain: "neuron-blood-foundation.firebaseapp.com",
databaseURL: "https://neuron-blood-foundation-default-rtdb.firebaseio.com",
projectId: "neuron-blood-foundation",
storageBucket: "neuron-blood-foundation.firebasestorage.app",
messagingSenderId: "160902995293",
appId: "1:160902995293:web:d0e4137de45290873e5cb4",
measurementId: "G-2NVL55Q5GN"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const donorGrid =
document.getElementById("donorGrid");

const totalDonors =
document.getElementById("totalDonors");

const searchInput =
document.getElementById("searchInput");

const bloodFilter =
document.getElementById("bloodFilter");

const divisionFilter =
document.getElementById("divisionFilter");

const districtFilter =
document.getElementById("districtFilter");

const upazilaFilter =
document.getElementById("upazilaFilter");

let allDonors = [];

[
"A+","A-",
"B+","B-",
"O+","O-",
"AB+","AB-"
].forEach(group=>{

bloodFilter.innerHTML +=
`<option value="${group}">
${group}
</option>`;

});

function renderDonors(){

donorGrid.innerHTML="";

let count=0;

const searchValue =
searchInput.value
.toLowerCase();

const bloodValue =
bloodFilter.value;

const divisionValue =
divisionFilter.value;

const districtValue =
districtFilter.value;

const upazilaValue =
upazilaFilter.value;

allDonors.forEach(donor=>{

if(donor.status!=="Approved"){
return;
}

if(
bloodValue &&
donor.blood!==bloodValue
){
return;
}

if(
divisionValue &&
donor.division!==divisionValue
){
return;
}

if(
districtValue &&
donor.district!==districtValue
){
return;
}

if(
upazilaValue &&
donor.upazila!==upazilaValue
){
return;
}

const searchMatch =

(donor.name || "")
.toLowerCase()
.includes(searchValue)

||

(donor.phone || "")
.includes(searchValue)

||

(donor.blood || "")
.toLowerCase()
.includes(searchValue);

if(!searchMatch){
return;
}

count++;

const avatar =
donor.gender==="Female"
? "👩"
: "👨";

    donorGrid.innerHTML += `

<div class="donor-card">

<div class="top-info">

<div class="avatar">
${avatar}
</div>

<div>

<div class="name">
${donor.name || ""}
</div>

<span class="blood">
${donor.blood || ""}
</span>

</div>

</div>

<div>
📍 ${donor.district || ""}
</div>

<div>
🏠 ${donor.upazila || ""}
</div>

<div style="
margin-top:8px;
font-size:14px;
color:#555;
">

🩸 Last Donation:
${donor.lastDonation || "Not Available"}

</div>

${(() => {

const lastDate =
new Date(donor.lastDonation);

const today =
new Date();

const diffDays =
Math.floor(
(today - lastDate)
/
(1000 * 60 * 60 * 24)
);

if(diffDays >= 90){

return `
<div class="status available">
🟢 Available
</div>
`;

}

return `
<div class="status unavailable">
🔴 Unavailable
</div>
`;

})()}

<div class="action-buttons">

<button
class="call-btn"
onclick="window.location.href='tel:${donor.phone}'">

Call

</button>

<button
class="whatsapp-btn"
onclick="window.open('https://wa.me/88${donor.phone}')">

WhatsApp

</button>

<button
class="details-btn"
onclick="showProfile(
'${donor.name || ""}',
'${donor.blood || ""}',
'${donor.phone || ""}',
'${donor.gender || ""}',
'${donor.age || ""}',
'${donor.weight || ""}',
'${donor.division || ""}',
'${donor.district || ""}',
'${donor.upazila || ""}',
'${donor.village || ""}',
'${donor.address || ""}',
'${donor.lastDonation || ""}'
)">
Profile
</button>

</div>

</div>

`;

});

totalDonors.textContent = count;

if(count===0){

donorGrid.innerHTML =
"<h3>No Donors Found</h3>";

}

}

    const divisions = new Set();
const districts = new Set();
const upazilas = new Set();

onSnapshot(
collection(db,"donors"),

(snapshot)=>{

allDonors = [];

divisions.clear();
districts.clear();
upazilas.clear();

snapshot.forEach(doc=>{

const donor = doc.data();

allDonors.push(donor);

if(donor.status==="Approved"){

if(donor.division){
divisions.add(donor.division);
}

if(donor.district){
districts.add(donor.district);
}

if(donor.upazila){
upazilas.add(donor.upazila);
}

}

});

divisionFilter.innerHTML =
'<option value="">All Divisions</option>';

districtFilter.innerHTML =
'<option value="">All Districts</option>';

upazilaFilter.innerHTML =
'<option value="">All Upazilas</option>';

[...divisions]
.sort()
.forEach(item=>{

divisionFilter.innerHTML +=
`<option value="${item}">
${item}
</option>`;

});

[...districts]
.sort()
.forEach(item=>{

districtFilter.innerHTML +=
`<option value="${item}">
${item}
</option>`;

});

[...upazilas]
.sort()
.forEach(item=>{

upazilaFilter.innerHTML +=
`<option value="${item}">
${item}
</option>`;

});

renderDonors();

});

searchInput.addEventListener(
"input",
renderDonors
);

bloodFilter.addEventListener(
"change",
renderDonors
);

divisionFilter.addEventListener(
"change",
renderDonors
);

districtFilter.addEventListener(
"change",
renderDonors
);

upazilaFilter.addEventListener(
"change",
renderDonors
);

    window.showProfile = function(
name,
blood,
phone,
gender,
age,
weight,
division,
district,
upazila,
village,
address,
lastDonation
){

const modal =
document.getElementById("profileModal");

const content =
document.getElementById("profileContent");

        const donationDate =
new Date(lastDonation);

const eligibleDate =
new Date(donationDate);

eligibleDate.setDate(
eligibleDate.getDate() + 90
);

const today =
new Date();

let eligibilityText = "";

if(!isNaN(eligibleDate)){

if(today >= eligibleDate){

eligibilityText =
"🟢 Eligible Now";

}else{

eligibilityText =
"🔴 Eligible After: " +
eligibleDate.toLocaleDateString(
"en-GB",
{
day:"numeric",
month:"long",
year:"numeric"
}
)

}

}else{

eligibilityText =
"Not Available";

} 
content.innerHTML = `

<h2>${name}</h2>

<p>🩸 Blood Group: ${blood}</p>

<p>📞 Phone: ${phone}</p>

<p>🚻 Gender: ${gender}</p>

<p>🎂 Age: ${age}</p>

<p>⚖️ Weight: ${weight} KG</p>

<hr>

<p>🌍 Division: ${division}</p>

<p>📍 District: ${district}</p>

<p>📌 Upazila: ${upazila}</p>

<p>🏘️ Village: ${village}</p>

<p>🏠 Address: ${address}</p>

<hr>

<p>🩸 Last Donation: ${lastDonation}</p>
<p>${eligibilityText}</p>

<br>

<button
class="call-btn"
onclick="window.location.href='tel:${phone}'">
Call
</button>

<button
class="whatsapp-btn"
onclick="window.open('https://wa.me/88${phone}')">
WhatsApp
</button>

<button
onclick="
document.getElementById('profileModal').style.display='none'
"
style="
margin-top:10px;
width:100%;
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
">
Close
</button>

`;

modal.style.display = "flex";

};

const emergencyDistrict = document.getElementById("emergencyDistrict");
const emergencyUpazila = document.getElementById("emergencyUpazila");

fetch("https://iqbalhasandev.github.io/bangladesh-geo-json/bangladesh-geo.json")
    .then(response => response.json())
    .then(data => {

        // সব District একসাথে নেওয়া
        let districts = [];

        data.forEach(division => {
            if (division.districts) {
                districts.push(...division.districts);
            }
        });

        // District A-Z
        districts.sort((a, b) =>
            a.name.localeCompare(b.name)
        );

        // District dropdown
        districts.forEach(district => {

            const option = document.createElement("option");

            option.value = district.name;
            option.textContent = district.name;

            emergencyDistrict.appendChild(option);

        });

        // District select করলে Upazila আসবে
        emergencyDistrict.addEventListener("change", function () {

            emergencyUpazila.innerHTML =
                '<option value="">Select Upazila</option>';

            const selectedDistrict =
                districts.find(
                    district => district.name === this.value
                );

            if (!selectedDistrict) return;

            let upazilas =
                selectedDistrict.upazilas || [];

            // Upazila A-Z
            upazilas.sort((a, b) =>
                a.name.localeCompare(b.name)
            );

            upazilas.forEach(upazila => {

                const option =
                    document.createElement("option");

                option.value = upazila.name;
                option.textContent = upazila.name;

                emergencyUpazila.appendChild(option);

            });

        });

    })
    .catch(error => {
        console.error("Location data error:", error);
    });


    document.getElementById("submitEmergency").addEventListener("click", async function(){

    const requestData = {

        patientProblem:
        document.getElementById("emergencyProblem").value,

        bloodGroup:
        document.getElementById("emergencyBlood").value,

        bloodQuantity:
        document.getElementById("emergencyQuantity").value,

        requiredDate:
        document.getElementById("emergencyDate").value,

        requiredTime:
        document.getElementById("emergencyTime").value,

        district:
        document.getElementById("emergencyDistrict").value,

        upazila:
        document.getElementById("emergencyUpazila").value,

        hospital:
        document.getElementById("emergencyHospital").value,

        contactNumber:
        document.getElementById("emergencyContact").value,

        referenceName:
        document.getElementById("emergencyReferenceName").value,

        referenceNumber:
        document.getElementById("emergencyReferencePhone").value,

        additionalNote:
        document.getElementById("emergencyNote").value,

        status: "Pending",

        createdAt: new Date().toISOString()

    };

    try {

        await addDoc(
            collection(db, "emergencyRequests"),
            requestData
        );

        alert("🩸 Emergency Blood Request submitted successfully!");

        document.getElementById("emergencyModal").style.display = "none";

    } catch(error) {

        console.error(error);

        alert("❌ Request submit failed. Please try again.");

    }

});
    
</script>

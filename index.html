<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuron Blood Foundation - Blood Donor List</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f8f9fa; padding: 10px; }
        .header { background: #dc3545; color: white; padding: 15px; text-align: center; border-radius: 10px; margin-bottom: 15px; }
        .header h1 { font-size: 20px; }
        .header p { font-size: 12px; margin-top: 5px; }
        .donor-card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .donor-name { font-size: 18px; font-weight: bold; color: #dc3545; }
        .donor-info { margin-top: 8px; font-size: 14px; }
        .donor-info span { display: block; margin: 4px 0; }
        .status { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; display: inline-block; margin-top: 8px; }
        .available { background: #d4edda; color: #155724; }
        .blood-group { background: #dc3545; color: white; padding: 3px 8px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Neuron Blood Foundation</h1>
        <p>রক্ত দিন, জীবন বাঁচান ❤️</p>
    </div>

    <div id="donorList">
        <!-- DONOR 1 -->
        <div class="donor-card">
            <div class="donor-name">Imran</div>
            <div class="donor-info">
                <span><b>বয়স:</b> 21 বছর</span>
                <span><b>Blood Group:</b> <span class="blood-group">B+</span></span>
                <span><b>Location:</b> Savar, Dhaka</span>
                <span><b>Number:</b> 01627-000</span>
                <span><b>Last Donate:</b> 36 days ago</span>
            </div>
            <div class="status available">Available - রক্ত দিতে পারবে</div>
        </div>
    </div>
</body>
</html>

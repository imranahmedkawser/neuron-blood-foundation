<!DOCTYPE html>
<html lang="bn">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Contact - Neuron Blood Foundation</title>
 <style>
 * { margin: 0; padding: 0; box-sizing: border-box; }
 body { 
 font-family: Arial, sans-serif; 
 background:#f5f5f5; 
 text-align:center; 
 padding: 15px;
 }

 /* Header লাল অংশ */
 .top-header {
 background: #c70000;
 padding: 10px;
 border-radius: 8px;
 margin-bottom: 15px;
 }
 .top-header div {
 background: white;
 padding: 8px;
 border-radius: 4px;
 color: #333;
 font-weight: bold;
 }

 /* Banner - Image এর মতো */
 .banner {
 position: relative;
 width: 100%;
 max-width: 800px;
 margin: 0 auto 20px auto;
 border-radius: 12px;
 overflow: hidden;
 box-shadow: 0 4px 15px rgba(0,0,0,0.2);
 }
 .banner img {
 width: 100%;
 height: auto;
 display: block;
 pointer-events: none; /* কেউ কপি করতে পারবে না */
 }
 .banner-text {
 position: absolute;
 top: 15%;
 left: 5%;
 background: rgba(255,255,255,0.95);
 padding: 15px 20px;
 border-radius: 8px;
 text-align: left;
 }
 .banner-text h2 {
 font-size: 32px;
 color: #c70000;
 font-weight: bold;
 margin-bottom: 5px;
 }
 .banner-text h2 span { color: #000; }
 .banner-text p {
 font-size: 24px;
 color: #000;
 font-weight: bold;
 }

 /* Foundation Name */
 .foundation-name {
 font-size: 20px;
 margin-bottom: 20px;
 font-weight: 500;
 }

 /* Button */
 .btn-box { 
 margin:10px auto; 
 max-width: 800px;
 background: #e9e9e9;
 padding: 15px;
 border-radius: 8px;
 text-align: left;
 }
 .btn-box a { 
 color:#000; 
 text-decoration:none; 
 font-size: 18px;
 font-weight: bold;
 display:block;
 }
 .home-link { display:block; margin-top:15px; color:#c70000; text-decoration:none; }

 /* Mobile */
 @media(max-width: 600px){
 .banner-text h2 { font-size: 20px; }
 .banner-text p { font-size: 16px; }
 .banner-text { padding: 10px 12px; }
 </style>
</head>
<body>

 <!-- লাল Header -->
 <div class="top-header">
 <div>24 Hours, Dhaka, Coreutt.</div>
 </div>

 <!-- Banner -->
 <div class="banner">
 <img src="https://urlkub.co/OlbFbi" alt="Blood Donation Banner">
 <div class="banner-text">
 <h2>Save <span>Lives,</span></h2>
 <p>Donate Blood 🩸</p>
 </div>
 </div>

 <div class="foundation-name">Neuron • Blood Foundation</div>

 <div class="btn-box">
 <a href="doner.html">Find Donor</a>
 </div>
 <div class="btn-box">
 <a href="become-doner.html">Become Donor</a>
 </div>

 <a href="index.html" class="home-link">← Home</a>

</body>
</html>

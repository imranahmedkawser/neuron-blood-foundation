<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Approved Donor List</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f8f5;
padding:20px;
}

.container{
max-width:1400px;
margin:auto;
}

.header{
background:linear-gradient(135deg,#0b8f4d,#16a34a);
color:white;
padding:35px 20px;
border-radius:20px;
text-align:center;
margin-bottom:20px;
box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.header h1{
font-size:32px;
margin-bottom:10px;
}

.filter-box{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,.08);
margin-bottom:20px;
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.filter-box input,
.filter-box select{
padding:12px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
}

.stats-box{
margin-bottom:20px;
}

.stat-card{
background:white;
padding:20px;
border-radius:15px;
text-align:center;
box-shadow:0 0 15px rgba(0,0,0,.08);
}

.stat-card h3{
font-size:30px;
color:#16a34a;
margin-bottom:5px;
}

.donor-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
}

.donor-card{
background:white;
border-radius:12px;
padding:12px;
box-shadow:0 3px 10px rgba(0,0,0,.08);
border-top:4px solid #16a34a;
}

.avatar{
width:60px;
height:60px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
background:#f1f1f1;
margin:0;
} 

.name{
font-size:18px;
font-weight:bold;
text-align:center;
margin-bottom:8px;
}
    
.top-info{
display:flex;
align-items:center;
gap:12px;
margin-bottom:10px;
}
    
.blood{
display:inline-block;
background:#d90000;
color:white;
padding:6px 12px;
border-radius:20px;
font-weight:bold;
}

.status{
font-weight:bold;
margin-top:10px;
}

.available{
color:green;
}

.unavailable{
color:red;
}

.action-buttons{
display:flex;
gap:10px;
margin-top:15px;
}

.action-buttons button{
flex:1;
border:none;
padding:12px;
border-radius:10px;
cursor:pointer;
color:white;
font-weight:bold;
}

.call-btn{
background:#16a34a;
}

.whatsapp-btn{
background:#25D366;
}

.details-btn{
background:#d90000;
}

@media(max-width:768px){

.filter-box{
grid-template-columns:1fr;
}

.donor-grid{
grid-template-columns:1fr;
}

.header h1{
font-size:24px;
}

}

</style>

</head>

<body>

<div class="container">

    <!-- Header -->
    <div class="header">

        <h1>🩸 Approved Blood Donors</h1>

        <p>
            Find verified blood donors quickly
        </p>

    </div>

    <!-- Search & Filter -->
    <div class="filter-box">

        <input
        type="text"
        id="searchInput"
        placeholder="🔍 Search donor">

        <select id="bloodFilter">
            <option value="">All Blood Groups</option>
        </select>

        <select id="divisionFilter">
            <option value="">All Divisions</option>
        </select>

        <select id="districtFilter">
            <option value="">All Districts</option>
        </select>

        <select id="upazilaFilter">
            <option value="">All Upazilas</option>
        </select>

    </div>

    <!-- Statistics -->
    <div class="stats-box">

        <div class="stat-card">

            <h3 id="totalDonors">0</h3>

            <p>Total Approved Donors</p>

        </div>

    </div>

    <!-- Donor Cards -->
    <div id="donorGrid" class="donor-grid">

        Loading Donors...

    </div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {
apiKey: "AIzaSyBj65RM91KmaoARYOfSH1hs-6TY5Qo2SzA",
authDomain: "neuron-blood-foundation.firebaseapp.com",
databaseURL: "https://neuron-blood-foundation-default-rtdb.firebaseio.com",
projectId: "neuron-blood-foundation",
storageBucket: "neuron-blood-foundation.firebasestorage.app",
messagingSenderId: "160902995293",
appId: "1:160902995293:web:d0e4137de45290873e5cb4",
measurementId: "G-2NVL55Q5GN"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


const donorGrid =
document.getElementById("donorGrid");

const totalDonors =
document.getElementById("totalDonors");

    const searchInput =
document.getElementById("searchInput");
    const bloodFilter =
document.getElementById("bloodFilter");
    const divisionFilter =
document.getElementById("divisionFilter");

const districtFilter =
document.getElementById("districtFilter");

const upazilaFilter =
document.getElementById("upazilaFilter");
    [
"A+","A-",
"B+","B-",
"O+","O-",
"AB+","AB-"
].forEach(group=>{

bloodFilter.innerHTML +=
`<option value="${group}">
${group}
</option>`;

});

onSnapshot(
collection(db,"donors"),

(snapshot)=>{

donorGrid.innerHTML="";

let approvedCount=0;

snapshot.forEach((doc)=>{

const donor = doc.data();

if(donor.status==="Approved"){
    const selectedBlood =
bloodFilter.value;

if(
selectedBlood &&
donor.blood !== selectedBlood
){

return;

}

    const searchValue =
searchInput.value.toLowerCase();

const searchMatch =

(donor.name || "")
.toLowerCase()
.includes(searchValue)

||

(donor.phone || "")
.includes(searchValue)

||

(donor.blood || "")
.toLowerCase()
.includes(searchValue);

if(!searchMatch){

return;

}
    if(
divisionFilter.value &&
donor.division !== divisionFilter.value
){

return;

}

if(
districtFilter.value &&
donor.district !== districtFilter.value
){

return;

}

if(
upazilaFilter.value &&
donor.upazila !== upazilaFilter.value
){

return;

}

approvedCount++;

const avatar =
donor.gender==="Female"
? "👩"
: "👨";

donorGrid.innerHTML += `

<div class="donor-card">

<div class="top-info">

<div class="avatar">
${avatar}
</div>

<div>

<div class="name">
${donor.name || ""}
</div>

<span class="blood">
${donor.blood || ""}
</span>

</div>

</div>

<div>
📍 ${donor.district || ""}
</div>

<div>
🏠 ${donor.upazila || ""}
</div>

<div class="status available">
🟢 Available
</div>

<div class="action-buttons">

<button
class="call-btn"
onclick="window.location.href='tel:${donor.phone}'">

Call

</button>

<button
class="whatsapp-btn"
onclick="window.open('https://wa.me/88${donor.phone}')">

WhatsApp

</button>

</div>

</div>

`;

}

});

totalDonors.textContent =
approvedCount;

if(approvedCount===0){

donorGrid.innerHTML =
"<h3>No Approved Donors Found</h3>";

}

}

);

</script>
</body>
</html>

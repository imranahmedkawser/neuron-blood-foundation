
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Member Login | Neuron Blood Foundation</title>

<style>
:root{
    --green:#087653;
    --dark:#064b37;
    --deep:#033b2c;
    --light:#e9f5ef;
    --text:#203b30;
    --muted:#82938a;
    --border:#dce9e1;
    --red:#d93636;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 10% 15%,rgba(31,157,110,.18),transparent 32%),
        radial-gradient(circle at 90% 85%,rgba(8,118,83,.16),transparent 32%),
        linear-gradient(135deg,#eaf5ef,#f7fbf8);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px 16px;
    position:relative;
    overflow-x:hidden;
}

/* BACKGROUND DECORATION */

.bg-circle{
    position:fixed;
    border-radius:50%;
    pointer-events:none;
    border:1px solid rgba(8,118,83,.10);
}

.circle-one{
    width:280px;
    height:280px;
    top:-120px;
    right:-90px;
}

.circle-two{
    width:380px;
    height:380px;
    bottom:-210px;
    left:-160px;
}

/* MAIN CARD */

.login-card{
    width:100%;
    max-width:440px;
    background:rgba(255,255,255,.96);
    border:1px solid rgba(255,255,255,.8);
    border-radius:22px;
    padding:34px 30px 27px;
    box-shadow:0 22px 65px rgba(4,75,55,.13);
    position:relative;
    z-index:1;
    overflow:hidden;
}

.login-card::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:5px;
    background:linear-gradient(90deg,#064b37,#12a276,#064b37);
}

/* BRAND */

.brand{
    text-align:center;
    margin-bottom:29px;
}

.logo{
    width:70px;
    height:70px;
    margin:0 auto 13px;
    border-radius:21px;
    background:linear-gradient(145deg,#0a956b,#04533b);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:31px;
    font-weight:800;
    box-shadow:0 9px 22px rgba(8,118,83,.24);
    position:relative;
}

.logo::after{
    content:"+";
    position:absolute;
    font-size:17px;
    font-weight:bold;
    top:8px;
    right:11px;
    color:#c7ffe5;
}

.brand h2{
    font-size:19px;
    letter-spacing:.5px;
    color:var(--dark);
    font-weight:800;
}

.brand p{
    font-size:11px;
    color:var(--muted);
    margin-top:7px;
    letter-spacing:.3px;
}

/* TITLE */

.login-title{
    text-align:center;
    color:var(--text);
    font-size:25px;
    font-weight:800;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    line-height:1.6;
    margin-bottom:27px;
}

/* FORM */

.field{
    margin-bottom:19px;
}

.field label{
    display:block;
    font-size:13px;
    font-weight:700;
    color:#344e40;
    margin-bottom:9px;
}

.input-wrap{
    position:relative;
}

.field input{
    width:100%;
    height:49px;
    border:1px solid var(--border);
    border-radius:10px;
    padding:0 14px;
    outline:none;
    font-size:14px;
    color:var(--text);
    background:#fbfdfb;
    transition:.2s;
}

.field input:focus{
    border-color:var(--green);
    background:white;
    box-shadow:0 0 0 3px rgba(8,118,83,.09);
}

.password-input{
    padding-right:52px !important;
}

.eye-btn{
    position:absolute;
    right:13px;
    top:50%;
    transform:translateY(-50%);
    width:28px;
    height:28px;
    border:none;
    background:none;
    color:#71877a;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
}

.eye-btn:hover{
    color:var(--green);
}

.eye-btn svg{
    width:21px;
    height:21px;
}

/* FORGOT PASSWORD */

.forgot-row{
    display:flex;
    justify-content:flex-end;
    margin-top:-3px;
    margin-bottom:23px;
}

.forgot-btn{
    border:none;
    background:none;
    color:var(--green);
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.forgot-btn:hover{
    text-decoration:underline;
}

/* LOGIN BUTTON */

.login-btn{
    width:100%;
    height:51px;
    border:none;
    border-radius:10px;
    background:linear-gradient(110deg,#087653,#07543c);
    color:white;
    font-size:15px;
    font-weight:800;
    letter-spacing:.3px;
    cursor:pointer;
    box-shadow:0 7px 17px rgba(8,118,83,.20);
    transition:.2s;
}

.login-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 22px rgba(8,118,83,.26);
}

.login-btn:disabled{
    opacity:.65;
    cursor:not-allowed;
    transform:none;
}

/* LOADING */

.spinner{
    display:inline-block;
    width:15px;
    height:15px;
    border:2px solid rgba(255,255,255,.35);
    border-top-color:white;
    border-radius:50%;
    animation:spin .7s linear infinite;
    vertical-align:middle;
    margin-right:7px;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

/* MESSAGE */

.message{
    display:none;
    margin-top:16px;
    padding:11px 12px;
    border-radius:8px;
    font-size:12px;
    text-align:center;
    line-height:1.6;
}

.message.error{
    display:block;
    background:#fff0f0;
    color:var(--red);
    border:1px solid #ffdada;
}

.message.success{
    display:block;
    background:#eaf8f0;
    color:var(--green);
    border:1px solid #d0eddd;
}

/* REGISTRATION LINK */

.apply-box{
    text-align:center;
    margin-top:24px;
    padding-top:19px;
    border-top:1px solid #edf2ee;
    color:#718078;
    font-size:12px;
}

.apply-box a{
    display:inline-block;
    color:var(--green);
    font-weight:800;
    text-decoration:none;
    margin-left:4px;
}

.apply-box a:hover{
    text-decoration:underline;
}

/* BACK BUTTON */

.back-btn{
    width:100%;
    height:44px;
    margin-top:16px;
    border:1px solid var(--border);
    border-radius:9px;
    background:white;
    color:#52665a;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

.back-btn:hover{
    background:#f1f8f4;
    border-color:#b8d8c7;
    color:var(--green);
}

/* FOOTER */

.footer{
    text-align:center;
    margin-top:22px;
    color:#98a69e;
    font-size:10px;
    line-height:1.7;
}

/* MOBILE */

@media(max-width:420px){

    body{
        padding:18px 13px;
    }

    .login-card{
        padding:29px 21px 23px;
        border-radius:18px;
    }

    .brand h2{
        font-size:17px;
    }

    .login-title{
        font-size:23px;
    }

}
</style>
</head>

<body>

<div class="bg-circle circle-one"></div>
<div class="bg-circle circle-two"></div>

<div class="login-card">

    <div class="brand">

        <div class="logo">N</div>

        <h2>NEURON BLOOD FOUNDATION</h2>

        <p>With youth; on the path of humanity</p>

    </div>

    <h1 class="login-title">Member Login</h1>

    <p class="subtitle">
        Welcome back! Login to access your member account.
    </p>


    <form id="loginForm">

        <div class="field">

            <label for="email">Email Address</label>

            <div class="input-wrap">

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your registered email"
                    autocomplete="username"
                    required
                >

            </div>

        </div>


        <div class="field">

            <label for="password">Password</label>

            <div class="input-wrap">

                <input
                    type="password"
                    id="password"
                    class="password-input"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="eye-btn"
                    id="showPassword"
                    aria-label="Show password"
                    title="Show password"
                >

                    <svg id="eyeIcon"
                         xmlns="http://www.w3.org/2000/svg"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round">

                        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
                        <circle cx="12" cy="12" r="3"/>

                    </svg>

                </button>

            </div>

        </div>


        <div class="forgot-row">

            <button
                type="button"
                class="forgot-btn"
                id="forgotPassword"
            >
                Forgot Password?
            </button>

        </div>


        <button
            type="submit"
            class="login-btn"
            id="loginBtn"
            disabled
        >
            Preparing Login...
        </button>

        <div id="message" class="message"></div>

    </form>


    <div class="apply-box">

        Not a member yet?

        <a href="member-registration.html">
            Apply as Member
        </a>

    </div>


    <button
        type="button"
        class="back-btn"
        id="backBtn"
    >
        ← Back
    </button>


    <div class="footer">

        © Neuron Blood Foundation

        <br>

        With youth; on the path of humanity

    </div>

</div>


<script type="module">

/* FIREBASE IMPORTS */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    setPersistence,
    browserSessionPersistence,
    signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {
    apiKey: "AIzaSyBj65RM91KmaoARYOfSH1hs-6TY5Qo2SzA",
    authDomain: "neuron-blood-foundation.firebaseapp.com",
    projectId: "neuron-blood-foundation",
    storageBucket: "neuron-blood-foundation.firebasestorage.app",
    messagingSenderId: "160902995293",
    appId: "1:160902995293:web:cb9a42dfa4b61d593e5cb4",
    measurementId: "G-90P3HEZLPJ"
};


/* INITIALIZE */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* ELEMENTS */

const form = document.getElementById("loginForm");

const emailInput = document.getElementById("email");

const passwordInput = document.getElementById("password");

const loginBtn = document.getElementById("loginBtn");

const message = document.getElementById("message");

const forgotBtn = document.getElementById("forgotPassword");

const eyeBtn = document.getElementById("showPassword");


/* MESSAGE */

function showMessage(text,type){

    message.textContent = text;

    message.className = "message " + type;

}

function clearMessage(){

    message.textContent = "";

    message.className = "message";

}


/* EYE ICON */

const eyeOpen = `
<svg xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 24 24" fill="none"
stroke="currentColor" stroke-width="2"
stroke-linecap="round" stroke-linejoin="round">
<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
<circle cx="12" cy="12" r="3"/>
</svg>`;

const eyeClosed = `
<svg xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 24 24" fill="none"
stroke="currentColor" stroke-width="2"
stroke-linecap="round" stroke-linejoin="round">
<path d="M3 3l18 18"/>
<path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
<path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a15 15 0 0 1-3 3.8"/>
<path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1.2 0 2.3-.3 3.3-.7"/>
</svg>`;


eyeBtn.onclick = function(){

    if(passwordInput.type === "password"){

        passwordInput.type = "text";

        eyeBtn.innerHTML = eyeClosed;

        eyeBtn.setAttribute("aria-label","Hide password");

        eyeBtn.title = "Hide password";

    }else{

        passwordInput.type = "password";

        eyeBtn.innerHTML = eyeOpen;

        eyeBtn.setAttribute("aria-label","Show password");

        eyeBtn.title = "Show password";

    }

};


/* FRESH LOGIN ON EVERY ENTRY */

async function prepareFreshLogin(){

    loginBtn.disabled = true;

    loginBtn.textContent = "Preparing Login...";

    try{

        await signOut(auth);

        loginBtn.disabled = false;

        loginBtn.textContent = "Login to My Account";

    }
    catch(error){

        console.error("Session reset error:",error);

        showMessage(
            "Unable to prepare a fresh login. Please refresh the page.",
            "error"
        );

        loginBtn.disabled = true;

        loginBtn.textContent = "Login Unavailable";

    }

}


/* RUN WHEN PAGE OPENS OR RETURNS FROM BROWSER BACK */

window.addEventListener("pageshow",function(){

    prepareFreshLogin();

});


/* BACK BUTTON */

document.getElementById("backBtn").onclick = async function(){

    this.disabled = true;

    try{

        await signOut(auth);

    }catch(error){

        console.error(error);

    }

    if(window.history.length > 1){

        window.history.back();

    }else{

        window.location.replace("index.html");

    }

};


/* FORGOT PASSWORD */

forgotBtn.onclick = async function(){

    const email = emailInput.value.trim();

    if(!email){

        showMessage(
            "Please enter your registered email address first.",
            "error"
        );

        emailInput.focus();

        return;

    }

    forgotBtn.disabled = true;

    showMessage(
        "Sending password reset email...",
        "success"
    );

    try{

        await sendPasswordResetEmail(auth,email);

        showMessage(
            "If an account exists for this email, a password reset email will be sent. Please check your inbox.",
            "success"
        );

    }
    catch(error){

        console.error(error);

        showMessage(
            "Unable to send reset email. Please check your email address and try again.",
            "error"
        );

    }
    finally{

        forgotBtn.disabled = false;

    }

};


/* MEMBER LOGIN */

form.addEventListener("submit",async function(e){

    e.preventDefault();

    const email = emailInput.value.trim();

    const password = passwordInput.value;

    if(!email || !password){

        showMessage(
            "Please enter your Email and Password.",
            "error"
        );

        return;

    }

    loginBtn.disabled = true;

    loginBtn.innerHTML =
        '<span class="spinner"></span>Logging in...';

    clearMessage();

    try{

        /* USE SESSION-ONLY PERSISTENCE */

        await setPersistence(
            auth,
            browserSessionPersistence
        );


        /* FIREBASE AUTH LOGIN */

        const result = await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        const signedInUser = result.user;


        /* FIND MEMBER BY UID */

        const memberQuery = query(
            collection(db,"members"),
            where("uid","==",signedInUser.uid)
        );

        const memberSnapshot = await getDocs(memberQuery);


        if(memberSnapshot.empty){

            await signOut(auth);

            showMessage(
                "No approved member profile found for this account.",
                "error"
            );

            return;

        }


        /* CHECK APPROVAL */

        let approvedMember = false;

        memberSnapshot.forEach(memberDoc=>{

            const data = memberDoc.data();

            if(data.status === "Approved"){

                approvedMember = true;

            }

        });


        if(!approvedMember){

            await signOut(auth);

            showMessage(
                "Your member account is not approved yet.",
                "error"
            );

            return;

        }


        /* LOGIN SUCCESS */

        showMessage(
            "Login successful! Opening your profile...",
            "success"
        );

        window.location.replace("member-profile.html");

    }
    catch(error){

        console.error("Member Login Error:",error);

        if(auth.currentUser){

            try{

                await signOut(auth);

            }catch(signOutError){

                console.error(signOutError);

            }

        }

        showMessage(
            "Login failed. Please check your email and password or try again.",
            "error"
        );

    }
    finally{

        loginBtn.disabled = false;

        loginBtn.textContent = "Login to My Account";

    }

});

</script>

</body>
</html>

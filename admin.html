<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neuron Blood Foundation - Admin Panel</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
}

.admin-wrapper{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.admin-card{
    width:100%;
    max-width:900px;
    background:#fff;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,.1);
}

.admin-card h2{
    text-align:center;
    color:#d90000;
    margin-bottom:20px;
}

.admin-card input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:6px;
    margin-bottom:12px;
}

.btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:6px;
    background:#d90000;
    color:white;
    cursor:pointer;
}

.btn:hover{
    background:#b50000;
}

.error{
    color:red;
    margin-top:10px;
    text-align:center;
}

#adminPanel{
    display:none;
    margin-top:20px;
}

#pendingList{
    width:100%;
}

.pending-card{
    border:1px solid #ddd;
    border-radius:8px;
    padding:15px;
    margin-bottom:12px;
    background:#fff;
}

.pending-card h3{
    color:#d90000;
    margin-bottom:8px;
}

.pending-card p{
    margin:4px 0;
}

.action-buttons{
    display:flex;
    gap:10px;
    margin-top:10px;
}

.approve-btn{
    flex:1;
    background:green;
    color:white;
    border:none;
    padding:10px;
    border-radius:6px;
    cursor:pointer;
}

.decline-btn{
    flex:1;
    background:#d90000;
    color:white;
    border:none;
    padding:10px;
    border-radius:6px;
    cursor:pointer;
}

.no-data{
    text-align:center;
    font-weight:bold;
    padding:20px;
}

@media(max-width:768px){

    .admin-card{
        max-width:100%;
    }

    .action-buttons{
        flex-direction:column;
    }

}

    .dashboard-box{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-bottom:20px;
}

@media(max-width:768px){

    .dashboard-box{
        grid-template-columns:1fr;
    }

}
</style>
</head>

<body>

<div class="admin-wrapper">

    <div class="admin-card">

        <h2>Neuron Blood Foundation Admin Panel</h2>

        <div id="loginBox">

<input type="email" id="adminEmail" placeholder="Enter Admin Email">

<input type="password" id="adminPassword" placeholder="Enter Admin Password">

<button class="btn" onclick="adminLogin()">
Login
</button>

<div id="adminMessage"></div>

</div>

<button
class="btn"
onclick="adminLogin()">
Login
</button>
        
        <div id="adminMessage"></div>

        <div id="adminPanel" style="display:none;">

    <div class="dashboard-box">

        <button class="btn" onclick="showMembers()">
            Pending Members
            (<span id="memberCount">0</span>)
        </button>

        <button class="btn" onclick="showDonors()">
            Pending Donors
            (<span id="donorCount">0</span>)
        </button>

    </div>

    <div id="pendingList"></div>

    </div>

</div>


<script type="module">

import {
initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
onSnapshot,
updateDoc,
deleteDoc,
doc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {
    apiKey: "AIzaSyBj65RM91KmaoARYOfSH1hs-6TY5Qo2SzA",
    authDomain: "neuron-blood-foundation.firebaseapp.com",
    projectId: "neuron-blood-foundation",
    storageBucket: "neuron-blood-foundation.firebasestorage.app",
    messagingSenderId: "160902995293",
    appId: "1:160902995293:web:cb9a42dfa4b61d593e5cb4",
    measurementId: "G-90P3HEZLPJ"
};


/* INITIALIZE FIREBASE */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* ADMIN LOGIN */

window.adminLogin =
async function(){

const email =
document.getElementById("adminEmail").value.trim();

const password =
document.getElementById("adminPassword").value;

const message =
document.getElementById("adminMessage");


if(!email || !password){

message.innerHTML =
"<div class='error'>Enter Email and Password!</div>";

return;

}


try{

await signInWithEmailAndPassword(
auth,
email,
password
);

message.innerHTML="";

document.getElementById("loginBox")
.style.display="none";

loadPending();

}
catch(error){

message.innerHTML =
"<div class='error'>Invalid Email or Password!</div>";

}

};


/* LOAD PENDING MEMBERS */

function loadPending(){

const list =
document.getElementById("pendingList");

list.innerHTML="Loading...";


onSnapshot(
collection(db,"members"),

snapshot=>{

list.innerHTML="";

let found=false;


snapshot.forEach(item=>{

const data=item.data();


if(data.status==="Pending"){

found=true;


const div =
document.createElement("div");

div.className="pending-card";


div.innerHTML=`

<h3>
${data.fullNameEnglish || data.fullNameBangla}
</h3>

<p>
<b>Phone:</b>
${data.mobileNumber || ""}
</p>

<p>
<b>Email:</b>
${data.email || ""}
</p>

<p>
<b>Role:</b>
${data.interestedRole || ""}
</p>


<div class="action-buttons">

<button
class="approve-btn"
onclick="approveMember('${item.id}')">

Approve

</button>


<button
class="decline-btn"
onclick="deleteMember('${item.id}')">

Decline

</button>

</div>

`;


list.appendChild(div);

}

});


if(!found){

list.innerHTML =
"<div class='no-data'>No Pending Members</div>";

}

});

}


/* APPROVE */

window.approveMember =
async function(id){

try{

await updateDoc(
doc(db,"members",id),
{
status:"Approved"
}
);

alert("Member Approved");

}
catch(error){

alert("Error approving member.");

}

};


/* DECLINE */

window.deleteMember =
async function(id){

if(
!confirm("Delete this member?")
){

return;

}


try{

await deleteDoc(
doc(db,"members",id)
);

alert("Member Deleted");

}
catch(error){

alert("Error deleting member.");

}

};

</script>

</body>
</html>

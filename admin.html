<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neuron Blood Foundation - Admin Panel</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
}

.admin-wrapper{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.admin-card{
    width:100%;
    max-width:900px;
    background:#fff;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,.1);
}

.admin-card h2{
    text-align:center;
    color:#d90000;
    margin-bottom:20px;
}

.admin-card input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:6px;
    margin-bottom:12px;
}

.btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:6px;
    background:#d90000;
    color:white;
    cursor:pointer;
}

.btn:hover{
    background:#b50000;
}
    .active-btn{
    background:#28a745 !important;
}

.error{
    color:red;
    margin-top:10px;
    text-align:center;
}

#adminPanel{
    display:none;
    margin-top:20px;
}

#pendingList{
    width:100%;
}

.pending-card{
    border:1px solid #ddd;
    border-radius:8px;
    padding:15px;
    margin-bottom:12px;
    background:#fff;
}

.pending-card h3{
    color:#d90000;
    margin-bottom:8px;
}

.pending-card p{
    margin:4px 0;
}

.action-buttons{
    display:flex;
    gap:10px;
    margin-top:10px;
}

.details-btn{
    flex:1;
    background:#2563eb;
    color:white;
    border:none;
    padding:10px;
    border-radius:6px;
    cursor:pointer;
}
    
.approve-btn{
    flex:1;
    background:green;
    color:white;
    border:none;
    padding:10px;
    border-radius:6px;
    cursor:pointer;
}

.decline-btn{
    flex:1;
    background:#d90000;
    color:white;
    border:none;
    padding:10px;
    border-radius:6px;
    cursor:pointer;
}

.no-data{
    text-align:center;
    font-weight:bold;
    padding:20px;
}

@media(max-width:768px){

    .admin-card{
        max-width:100%;
    }

    .action-buttons{
        flex-direction:column;
    }

}

    .dashboard-box{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-bottom:20px;
}

@media(max-width:768px){

    .dashboard-box{
        grid-template-columns:1fr;
    }

}

    
/* Professional Member Details View */

.details-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 30, 25, 0.58);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    padding: 24px;
}

.details-panel {
    width: 82%;
    max-width: 900px;
    max-height: 82vh;
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 15px 45px rgba(0,0,0,0.22);
}

.details-header {
    background: #087653;
    color: white;
    padding: 17px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.details-header h2 {
    margin: 0;
    font-size: 19px;
    font-weight: 700;
}

.details-header button {
    background: rgba(255,255,255,0.15);
    color: white;
    border: none;
    border-radius: 6px;
    width: 34px;
    height: 34px;
    font-size: 21px;
    cursor: pointer;
}

.details-content {
    padding: 22px;
    overflow-y: auto;
    flex: 1;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    align-content: start;
    background: #f7f9f8;
}

.details-content > div {
    background: white;
    border: 1px solid #e5ebe8;
    border-radius: 9px;
    padding: 13px 15px;
    margin: 0 !important;
    border-left: 3px solid #0b8762 !important;
}

.details-content strong {
    font-size: 12px;
    color: #68756f !important;
    font-weight: 600;
}

.details-content div div {
    font-size: 14px;
    color: #202a25 !important;
    line-height: 1.5;
}

.details-actions {
    padding: 14px 22px;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    border-top: 1px solid #e5ebe8;
    background: white;
}

.details-actions button {
    padding: 10px 20px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-weight: 600;
}

.details-actions button:nth-child(1) {
    background: #087653;
    color: white;
}

.details-actions button:nth-child(2) {
    background: #dc3545;
    color: white;
}

.details-actions button:nth-child(3) {
    background: #edf1ef;
    color: #34423b;
}

@media (max-width: 600px) {
    .details-overlay {
        padding: 14px;
    }

    .details-panel {
        width: 100%;
        max-height: 88vh;
    }

    .details-content {
        grid-template-columns: 1fr;
        padding: 14px;
        gap: 9px;
    }

    .details-header {
        padding: 14px 16px;
    }

    .details-actions {
        padding: 12px;
        gap: 7px;
    }

    .details-actions button {
        padding: 9px 13px;
        font-size: 12px;
    }
}

    
</style>
</head>

<body>

<div class="admin-wrapper">

    <div class="admin-card">

        <h2>Neuron Blood Foundation Admin Panel</h2>

        <div id="loginBox">

<input type="email" id="adminEmail" placeholder="Enter Admin Email">

<input type="password" id="adminPassword" placeholder="Enter Admin Password">

<button class="btn" onclick="adminLogin()">
Login
</button>

<div id="adminMessage"></div>

</div>

        <div id="adminPanel" style="display:none;">

    <div class="dashboard-box">

    <button id="memberBtn" class="btn" onclick="showMembers()">
        👤 Pending Members
        (<span id="memberCount">...</span>)
    </button>

    <button id="donorBtn" class="btn" onclick="showDonors()">
        🩸 Pending Donors
        (<span id="donorCount">...</span>)
    </button>

    <button id="emergencyBtn" class="btn" onclick="showEmergencies()">
        🚨 Emergency Requests
        (<span id="emergencyCount">...</span>)
    </button>

</div>
            
    <div id="pendingList"></div>

            <!-- Member Details View -->
<div id="memberDetailsView" class="details-overlay" style="display:none;">
    <div class="details-panel">
        <div class="details-header">
            <h2>Member Application Details</h2>
            <button type="button" onclick="closeMemberDetails()">✕</button>
        </div>

        <div id="memberDetailsContent" class="details-content"></div>

        <div class="details-actions">
            <button type="button" id="detailsApproveBtn">Approve</button>
            <button type="button" id="detailsRejectBtn">Reject</button>
            <button type="button" onclick="closeMemberDetails()">Back</button>
        </div>
    </div>
</div>

    </div>

</div>


<script type="module">

import {
initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
onSnapshot,
updateDoc,
deleteDoc,
doc,
setDoc,
getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {
    apiKey: "AIzaSyBj65RM91KmaoARYOfSH1hs-6TY5Qo2SzA",
    authDomain: "neuron-blood-foundation.firebaseapp.com",
    projectId: "neuron-blood-foundation",
    storageBucket: "neuron-blood-foundation.firebasestorage.app",
    messagingSenderId: "160902995293",
    appId: "1:160902995293:web:cb9a42dfa4b61d593e5cb4",
    measurementId: "G-90P3HEZLPJ"
};


/* INITIALIZE FIREBASE */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


/* ADMIN LOGIN */

window.adminLogin =
async function(){

const email =
document.getElementById("adminEmail").value.trim();

const password =
document.getElementById("adminPassword").value;

const message =
document.getElementById("adminMessage");


if(!email || !password){

message.innerHTML =
"<div class='error'>Enter Email and Password!</div>";

return;

}


try{

await signInWithEmailAndPassword(
auth,
email,
password
);

message.innerHTML="";

    document.getElementById("loginBox")
.style.display="none";

    document.getElementById("adminPanel")
.style.display="block";

}
catch(error){

message.innerHTML =
"<div class='error'>Invalid Email or Password!</div>";

}

};


/* LOAD PENDING MEMBERS */

function loadPending(){

    const list = document.getElementById("pendingList");

    list.innerHTML = "Loading...";

    onSnapshot(
        collection(db, "memberApplications"),

        snapshot => {

            list.innerHTML = "";

            let found = false;
            let count = 0;

            snapshot.forEach(item => {

                const data = item.data();

                if(data.status === "Pending"){

                    found = true;
                    count++;

                    const div = document.createElement("div");

                    div.className = "pending-card";

                    div.innerHTML = `

                        <h3>
                            ${data.nameEnglish || data.nameBangla || "Name Not Given"}
                        </h3>

                        <p>
                            <b>Phone:</b>
                            ${data.mobile || data.mobileNumber || ""}
                        </p>

                        <p>
                            <b>Email:</b>
                            ${data.email || ""}
                        </p>

                        <p>
                            <b>Role:</b>
                            ${Array.isArray(data.memberTypes)
                                ? data.memberTypes.join(", ")
                                : data.interestedRole || data.memberTypes || ""}
                        </p>

                        <p><b>Status:</b> Pending</p>

                        <div class="action-buttons">

                            <button
                                class="details-btn"
                                onclick="showMemberDetails('${item.id}')">
                                View Details
                            </button>

                            <button
                                class="approve-btn"
                                onclick="approveMember('${item.id}')">
                                Approve
                            </button>

                            <button
                                class="decline-btn"
                                onclick="deleteMember('${item.id}')">
                                Decline
                            </button>

                        </div>
                    `;

                    list.appendChild(div);

                }

            });

            document.getElementById("memberCount").textContent = count;

            if(!found){

                list.innerHTML =
                    "<div class='no-data'>No Pending Members</div>";

            }

        },

        error => {

            console.error(error);

            list.innerHTML =
                "<div class='no-data'>Unable to load Member Requests</div>";

        }
    );

}

    
window.showMemberDetails = async function(id){

    const view = document.getElementById("memberDetailsView");
    const content = document.getElementById("memberDetailsContent");

    view.style.display = "flex";
    content.textContent = "Loading details...";

    try {

        const applicationRef = doc(db, "memberApplications", id);
        const applicationSnap = await getDoc(applicationRef);

        if(!applicationSnap.exists()){
            content.textContent = "Application not found!";
            return;
        }

        const data = applicationSnap.data();

        const labels = {
            nameBangla: "নাম (বাংলা)",
            nameEnglish: "Name (English)",
            fatherName: "Father's Name",
            motherName: "Mother's Name",
            dateOfBirth: "Date of Birth",
            gender: "Gender",
            bloodGroup: "Blood Group",
            nid: "NID Number",
            mobile: "Mobile Number",
            mobileNumber: "Mobile Number",
            email: "Email",
            whatsapp: "WhatsApp",
            facebook: "Facebook",
            currentAddress: "Current Address",
            permanentAddress: "Permanent Address",
            lastDonation: "Last Blood Donation",
            lastDonationDate: "Last Donation Date",
            interestedRole: "Interested Role",
            memberTypes: "Member Types",
            status: "Application Status"
        };

        content.innerHTML = "";

        Object.entries(data).forEach(([key, value]) => {

            if(
                key.toLowerCase().includes("password") ||
                value === null ||
                value === undefined ||
                value === ""
            ) return;

            const section = document.createElement("div");
            section.style.cssText =
                "background:#f0f8f5;padding:12px 15px;margin-bottom:10px;border-left:4px solid #087653;border-radius:8px;";

            const heading = document.createElement("strong");
            heading.style.cssText =
                "display:block;color:#087653;margin-bottom:5px;";

            heading.textContent = labels[key] ||
                key.replace(/([A-Z])/g, " $1").replace(/^./, c => c.toUpperCase());

            const detail = document.createElement("div");
            detail.style.cssText = "color:#333;word-break:break-word;";

            let displayValue = value;

            if(Array.isArray(value)){
                displayValue = value.join(", ");
            } else if(value && typeof value.toDate === "function"){
                displayValue = value.toDate().toLocaleString();
            } else if(value instanceof Date){
                displayValue = value.toLocaleString();
            } else if(typeof value === "object"){
                displayValue = JSON.stringify(value, null, 2);
            }

            detail.textContent = String(displayValue);

            section.appendChild(heading);
            section.appendChild(detail);
            content.appendChild(section);

        });

        document.getElementById("detailsApproveBtn").onclick = function(){
            closeMemberDetails();
            approveMember(id);
        };

        document.getElementById("detailsRejectBtn").onclick = function(){
            closeMemberDetails();
            deleteMember(id);
        };

    } catch(error){

        console.error(error);
        content.textContent = "Unable to load application details.";

    }
};

window.closeMemberDetails = function(){
    document.getElementById("memberDetailsView").style.display = "none";
};


    /* SHOW MEMBERS */

window.showMembers = function(){

    document.querySelector("#memberBtn")
    .classList.add("active-btn");

    document.querySelector("#donorBtn")
    .classList.remove("active-btn");

    document.querySelector("#emergencyBtn")
.classList.remove("active-btn");

    loadPending();

};

/* SHOW DONORS */

window.showDonors = function(){
    document.querySelector("#donorBtn")
.classList.add("active-btn");

document.querySelector("#memberBtn")
.classList.remove("active-btn");

    document.querySelector("#emergencyBtn")
.classList.remove("active-btn");

    const list =
    document.getElementById("pendingList");

    list.innerHTML = "Loading...";

    onSnapshot(
        collection(db,"donors"),

        snapshot=>{

            list.innerHTML="";

            let found=false;
            let count=0;

            snapshot.forEach(item=>{

                const data=item.data();

                if(data.status==="Pending"){

                    found=true;
                    count++;

                    const div =
                    document.createElement("div");

                    div.className="pending-card";

                    div.innerHTML=`

                    <h3>${data.name || ""}</h3>

                    <p>
                    <b>Phone:</b>
                    ${data.phone || ""}
                    </p>

                    <p>
                    <b>Blood Group:</b>
                    ${data.blood || ""}
                    </p>

                    <p>
                    <b>District:</b>
                    ${data.district || ""}
                    </p>

                    <div class="action-buttons">

                    <button
                    class="approve-btn"
                    onclick="approveDonor('${item.id}')">

                    Approve

                    </button>

                    <button
                    class="decline-btn"
                    onclick="deleteDonor('${item.id}')">

                    Decline

                    </button>

                    </div>
                    `;

                    list.appendChild(div);

                }

            });

            document.getElementById("donorCount").textContent = count;

            if(!found){

                list.innerHTML =
                "<div class='no-data'>No Pending Donors</div>";

            }

        }

    );

};


/* DONOR COUNT */

onSnapshot(
    collection(db,"donors"),

    snapshot=>{

        let count=0;

        snapshot.forEach(item=>{

            if(item.data().status==="Pending"){

                count++;

            }

        });

        const el =
        document.getElementById("donorCount");

        if(el){

            el.textContent=count;

        }

    }

);


/* MEMBER COUNT */

onSnapshot(
    collection(db, "memberApplications"),

    snapshot => {

        let count = 0;

        snapshot.forEach(item => {

            if(item.data().status === "Pending"){
                count++;
            }

        });

        document.getElementById("memberCount").textContent = count;

    },

    error => {
        console.error("Member Count Error:", error);
    }
);


/* APPROVE DONOR */

window.approveDonor =
async function(id){

    try{

        await updateDoc(
            doc(db,"donors",id),
            {
                status:"Approved"
            }
        );

        alert("Donor Approved");

    }
    catch(error){

        alert("Error approving donor");

    }

};


/* DELETE DONOR */

window.deleteDonor =
async function(id){

    if(!confirm("Delete this donor?")){

        return;

    }

    try{

        await deleteDoc(
            doc(db,"donors",id)
        );

        alert("Donor Deleted");

    }
    catch(error){

        alert("Error deleting donor");

    }

};

    
/* APPROVE MEMBER */

window.approveMember = async function(id){

    try{

        const applicationRef = doc(db, "memberApplications", id);

        const applicationSnap = await getDoc(applicationRef);

        if(!applicationSnap.exists()){
            alert("Application not found!");
            return;
        }

        const memberData = applicationSnap.data();

        await setDoc(doc(db, "members", id), {
            ...memberData,
            status: "Approved",
            approvedAt: new Date()
        });

        await deleteDoc(applicationRef);

        alert("Member Approved Successfully!");

    }
    catch(error){

        console.error(error);

        alert("Error approving member: " + error.message);

    }

};
    
/* DECLINE MEMBER */

window.deleteMember = async function(id){

    if(!confirm("Are you sure you want to reject this application?")){
        return;
    }

    try{

        await deleteDoc(
            doc(db, "memberApplications", id)
        );

        alert("Member Application Rejected!");

    }
    catch(error){

        console.error(error);

        alert("Error rejecting application: " + error.message);

    }

};
    
    /* SHOW EMERGENCY REQUESTS */

window.showEmergencies = function(){

    document.querySelector("#emergencyBtn")
    .classList.add("active-btn");

    document.querySelector("#memberBtn")
    .classList.remove("active-btn");

    document.querySelector("#donorBtn")
    .classList.remove("active-btn");

    const list =
    document.getElementById("pendingList");

    list.innerHTML = "Loading Emergency Requests...";


    onSnapshot(
        collection(db, "emergencyRequests"),

        snapshot => {

            list.innerHTML = "";

            let found = false;
            let count = 0;


            snapshot.forEach(item => {

    const data = item.data();

    if(
        data.status === "Closed" ||
        data.status === "Completed"
    ){
        return;
    }

    count++;
    found = true;

                const div =
                document.createElement("div");

                div.className = "pending-card";


                div.innerHTML = `

                    <h3>
                        🩸 ${data.bloodGroup || "Blood Group Not Given"}
                    </h3>

                    <p>
                        <b>Patient Problem:</b>
                        ${data.patientProblem || "Not given"}
                    </p>

                    <p>
                        <b>Blood Quantity:</b>
                        ${data.bloodQuantity || ""}
                    </p>

                    <p>
                        <b>Required Date:</b>
                        ${data.requiredDate || ""}
                    </p>

                    <p>
                        <b>Required Time:</b>
                        ${data.requiredTime || ""}
                    </p>

                    <p>
                        <b>District:</b>
                        ${data.district || ""}
                    </p>

                    <p>
                        <b>Upazila:</b>
                        ${data.upazila || ""}
                    </p>

                    <p>
                        <b>Hospital:</b>
                        ${data.hospital || ""}
                    </p>

                    <p>
                        <b>Contact:</b>
                        ${data.contactNumber || ""}
                    </p>

                    <p>
                        <b>Reference:</b>
                        ${data.referenceName || ""}
                    </p>

                    <p>
                        <b>Reference Number:</b>
                        ${data.referenceNumber || ""}
                    </p>

                    <p>
                        <b>Additional Note:</b>
                        ${data.additionalNote || "No additional note"}
                    </p>

                    <p>
                        <b>Status:</b>
                        ${data.status || "Pending"}
                    </p>

                    <div class="action-buttons">

                        <button
                        class="approve-btn"
                        onclick="approveEmergency('${item.id}')">

                        Approve

                        </button>

                        <button
                        class="decline-btn"
                        onclick="closeEmergency('${item.id}')">

                        Close

                        </button>

                    </div>

                `;


                list.appendChild(div);

            });


            document.getElementById("emergencyCount")
            .textContent = count;


            if(!found){

                list.innerHTML =
                "<div class='no-data'>No Emergency Requests</div>";

            }

        },

        error => {

            console.error(error);

            list.innerHTML =
            "<div class='no-data'>Unable to load Emergency Requests</div>";

        }

    );

};

/* APPROVE EMERGENCY */

window.approveEmergency =
async function(id){

    try{

        await updateDoc(
            doc(db,"emergencyRequests",id),
            {
                status:"Approved"
            }
        );

        alert("🚨 Emergency Request Approved");

    }
    catch(error){

        console.error(error);

        alert("❌ Error approving emergency request");

    }

};


/* CLOSE EMERGENCY */

window.closeEmergency =
async function(id){

    if(!confirm("Close this emergency request?")){

        return;

    }

    try{

        await updateDoc(
            doc(db,"emergencyRequests",id),
            {
                status:"Closed"
            }
        );

        alert("✅ Emergency Request Closed");

    }
    catch(error){

        console.error(error);

        alert("❌ Error closing emergency request");

    }

};
</script>

</body>
</html>
